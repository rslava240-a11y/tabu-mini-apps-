<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tabu — Операционная панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter+Tight:wght@400;500;600;700&family=Ponomar&family=Triodion&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #e8e8e8;
      --surface: #f6f6f6;
      --surface-elevated: #ffffff;
      --text: #141414;
      --text-secondary: #5c5c5c;
      --text-muted: #8a8a8a;
      --accent: #1b1b1b;
      --accent-soft: #ebebeb;
      --border: #dcdcdc;
      --danger: #d9383a;
      --danger-soft: #fdecec;
      --success: #1f8b4c;
      --success-soft: #e7f6ed;
      --font-calligraphy: 'Triodion', 'Ponomar', 'Cormorant Garamond', Georgia, serif;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --transition: 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(232, 232, 232, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      box-shadow: var(--shadow-sm);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.93);
      background: var(--accent-soft);
    }

    .main-view {
      flex: 1;
      padding: 12px 16px 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 38px 11px 14px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), background-color var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-elevated);
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: var(--accent-soft);
      color: var(--text-secondary);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-search.visible {
      display: inline-flex;
    }

    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 999px;
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
    }

    .chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeSlideIn 0.26s ease;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, background-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:active {
      transform: scale(0.985);
      background: var(--surface-elevated);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
      line-height: 1.42;
      white-space: pre-line;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
    }

    .pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .mini-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: var(--font-calligraphy);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.14s ease, background-color 0.2s ease;
    }

    .mini-btn:active {
      transform: scale(0.94);
    }

    .mini-btn.danger {
      color: var(--danger);
      border-color: rgba(217, 56, 58, 0.25);
      background: var(--danger-soft);
    }

    .mini-btn.status-on {
      background: var(--success-soft);
      color: var(--success);
      border-color: rgba(31, 139, 76, 0.25);
    }

    .mini-btn.status-off {
      background: var(--accent-soft);
      color: var(--text-secondary);
    }

    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-family: var(--font-calligraphy);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-family: var(--font-calligraphy);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .segmented {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .seg-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .seg-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      background: rgba(246, 246, 246, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-calligraphy);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.025em;
      line-height: 1.1;
      padding: 4px 2px;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-icon-wrap {
      width: 38px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .nav-item.active .nav-icon-wrap {
      background: var(--accent);
      color: #ffffff;
    }

    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(4px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      background: var(--surface);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-md);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .sheet-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 76px;
      resize: vertical;
    }

    .detail-block {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .detail-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-line;
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .photo-tile {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      aspect-ratio: 3 / 4;
    }

    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0f0f12;
    }

    .photo-tile-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 7px 8px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(12, 12, 15, 0.84) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .photo-action-btn {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(24, 24, 28, 0.88);
      color: #ffffff;
      font-family: var(--font-calligraphy);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      text-decoration: none;
    }

    .photo-action-btn.del {
      background: rgba(217, 56, 58, 0.9);
      border-color: rgba(255, 160, 160, 0.35);
    }

    .model-card-header-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .model-card-cover {
      width: 66px;
      height: 86px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      flex-shrink: 0;
    }

    .model-quick-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .upload-dropzone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--accent);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 90;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    .side-edge-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 35;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-right: none;
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
      padding: 12px 7px;
      font-family: var(--font-calligraphy);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform var(--transition), background-color 0.2s ease, padding var(--transition);
    }

    .side-edge-tab.otc-edge-tab {
      top: calc(50% + 96px);
      background: #282828;
    }

    .side-edge-tab:active {
      transform: translateY(-50%) translateX(-2px) scale(0.96);
    }

    .side-note-drawer {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(20, 20, 20, 0.42);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      display: flex;
      justify-content: flex-end;
    }

    .side-note-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-note-panel {
      width: min(92vw, 390px);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-note-drawer.open .side-note-panel {
      transform: translateX(0);
    }

    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .empty-state-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-state-sub {
      font-size: 13px;
      line-height: 1.45;
    }
  </style>
</head>
<body>
  <div class="toast" id="toast"></div>

  <div class="app-shell">
    <header class="app-header">
      <div class="brand">
        <div class="brand-badge" style="background:#ffffff; border:1px solid var(--border); padding:2px;">
          <svg viewBox="0 0 120 64" width="30" height="24" aria-label="TABU" role="img" style="display:block; width:100%; height:100%;">
            <text x="4" y="43" fill="#141414" font-family="Inter Tight, Arial Black, sans-serif" font-weight="900" font-size="25" letter-spacing="-1.5">TAB</text>
            <path d="M56 16 L63 16 L63 34 C63 40 67 43 72 43 C77 43 81 40 81 34 L81 16 L88 16 L88 35 C88 45 81 50 72 50 C63 50 56 45 56 35 Z" fill="#b31b24"/>
            <circle cx="72" cy="14" r="5" fill="#b31b24"/>
            <path d="M65 24 C67 20 77 20 79 24 L82 44 L62 44 Z" fill="#b31b24"/>
          </svg>
        </div>
        <div>
          <div class="brand-title" id="appTitle">Tabu</div>
          <div class="brand-sub" id="appSub">Операционная база • Тбилиси / Белград</div>
          <div class="brand-sub" id="syncStatusText" style="font-size:11px; color:var(--text-muted);">Синхронизация: подключение...</div>
        </div>
      </div>
    </header>

    <main class="main-view" id="mainView"></main>

    <nav class="bottom-nav" id="bottomNav">

    const photoUrlCache = new Map();

    function normalizePhotoEntry(entry, idx = 0, modelId = "", fieldName = "photos") {
      if (!entry) return null;
      if (typeof entry === "string") {
        const trimmed = entry.trim();
        if (!trimmed) return null;
        return {
          photoId: modelId ? createMediaScopeKey(modelId, fieldName, `${USER_ADDED_PHOTO_PREFIX}legacy_${idx}`) : "",
          src: trimmed,
          name: `photo_${idx + 1}.jpg`
        };
      }
      if (typeof entry === "object") {
        let photoId = String(entry.photoId || entry.id || "").trim();
        if (modelId && fieldName) {
          if (photoId && !belongsToModelScope(photoId, modelId, fieldName)) {
            const suffix = photoId.replace(/[^a-zA-Z0-9_-]/g, "").slice(-18);
            photoId = createMediaScopeKey(
              modelId,
              fieldName,
              suffix.startsWith(USER_ADDED_PHOTO_PREFIX) ? suffix : `${USER_ADDED_PHOTO_PREFIX}${suffix || `item_${idx}`}`
            );
          } else if (!photoId) {
            photoId = createMediaScopeKey(modelId, fieldName, `${USER_ADDED_PHOTO_PREFIX}item_${idx}`);
          }
        }
        const rawSrc = String(entry.src || entry.dataUrl || "").trim();
        const cachedSrc = photoId ? String(photoUrlCache.get(photoId) || "").trim() : "";
        return {
          photoId,
          src: rawSrc || cachedSrc || "",
          name: String(entry.name || `photo_${idx + 1}.jpg`)
        };
      }
      return null;
    }

    function getPhotoDisplaySrc(entry) {
      if (!entry) return "";
      if (typeof entry === "string") return entry.trim();
      const photoId = String(entry.photoId || entry.id || "").trim();
      const cached = photoId ? String(photoUrlCache.get(photoId) || "").trim() : "";
      const direct = String(entry.src || entry.dataUrl || "").trim();
      return direct || cached || "";
    }

    async function hydrateStoredPhotos(modelsList) {
      if (!Array.isArray(modelsList) || modelsList.length === 0) return;
      let anyHydrated = false;

      for (let mIdx = 0; mIdx < modelsList.length; mIdx += 1) {
        const model = modelsList[mIdx];
        if (!model || typeof model !== "object") continue;
        const modelId = String(model.id || `m_${mIdx}`).trim();

        for (const fieldName of ["photos", "routePhotos"]) {
          const arr = Array.isArray(model[fieldName]) ? model[fieldName] : [];
          for (let i = 0; i < arr.length; i += 1) {
            const norm = normalizePhotoEntry(arr[i], i, modelId, fieldName);
            if (!norm || !norm.photoId) continue;

            let resolvedSrc = getPhotoDisplaySrc(norm);
            if (!resolvedSrc) {
              const rec = await getPhotoRecordFromDb(norm.photoId);
              if (rec && rec.dataUrl) {
                resolvedSrc = String(rec.dataUrl).trim();
              }
            }

            if (resolvedSrc) {
              photoUrlCache.set(norm.photoId, resolvedSrc);
              if (typeof arr[i] === "object" && arr[i] !== null && !arr[i].src) {
                arr[i] = {
                  ...arr[i],
                  photoId: norm.photoId,
                  src: resolvedSrc,
                  name: norm.name
                };
                anyHydrated = true;
              }
            }
          }
        }
      }

      if (anyHydrated && !isApplyingRemoteSnapshot) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(buildSyncableState(state, { includePhotos: true })));
        } catch (e) {}
        renderMain();
      }
    }

    async function hydrateStoredVideos(modelsList) {
      if (!Array.isArray(modelsList) || modelsList.length === 0) return;
      let anyHydrated = false;

      for (let mIdx = 0; mIdx < modelsList.length; mIdx += 1) {
        const model = modelsList[mIdx];
        if (!model || typeof model !== "object") continue;
        const modelId = String(model.id || `m_${mIdx}`).trim();

        for (const fieldName of ["videos", "routeVideos"]) {
          const arr = Array.isArray(model[fieldName]) ? model[fieldName] : [];
          for (let i = 0; i < arr.length; i += 1) {
            const norm = normalizeMediaItem(arr[i], `${fieldName}_${i + 1}.mp4`, modelId, fieldName);
            if (!norm || !norm.mediaId) continue;

            let playSrc = norm.src || norm.dataUrl || videoUrlCache.get(norm.mediaId) || "";
            if (!playSrc || playSrc.startsWith("blob:")) {
              const rec = await getVideoRecordFromDb(norm.mediaId);
              if (rec) {
                if (rec.blob instanceof Blob) {
                  try {
                    const freshBlobUrl = URL.createObjectURL(rec.blob);
                    const prevUrl = videoUrlCache.get(norm.mediaId);
                    if (prevUrl && prevUrl.startsWith("blob:") && prevUrl !== freshBlobUrl) {
                      try { URL.revokeObjectURL(prevUrl); } catch (e) {}
                    }
                    videoUrlCache.set(norm.mediaId, freshBlobUrl);
                    playSrc = freshBlobUrl;
                  } catch (e) {
                    playSrc = rec.dataUrl || "";
                  }
                } else if (rec.dataUrl) {
                  playSrc = rec.dataUrl;
                }
              }
            }

            if (playSrc && typeof arr[i] === "object" && arr[i] !== null && arr[i].src !== playSrc) {
              arr[i] = {
                ...arr[i],
                mediaId: norm.mediaId,
                src: playSrc,
                dataUrl: norm.dataUrl || (playSrc.startsWith("data:video/") ? playSrc : "")
              };
              anyHydrated = true;
            }
          }
        }
      }

      if (anyHydrated && !isApplyingRemoteSnapshot) {
        renderMain();
      }
    }

    let photoDbPromise = null;
    function openPhotoDb() {
      if (photoDbPromise) return photoDbPromise;
      photoDbPromise = new Promise((resolve) => {
        if (!("indexedDB" in window)) {
          resolve(null);
          return;
        }
        try {
          const req = indexedDB.open(PHOTO_DB_NAME, 1);
          req.onupgradeneeded = () => {
            const dbInstance = req.result;
            if (!dbInstance.objectStoreNames.contains(PHOTO_STORE_NAME)) {
              dbInstance.createObjectStore(PHOTO_STORE_NAME, { keyPath: "id" });
            }
          };
          req.onsuccess = () => resolve(req.result);
          req.onerror = () => resolve(null);
        } catch (err) {
          resolve(null);
        }
      });
      return photoDbPromise;
    }

    async function savePhotoDataToDb(photoId, dataUrl, name = "photo.jpg") {
      if (!photoId || !dataUrl) return false;
      photoUrlCache.set(photoId, dataUrl);
      const idb = await openPhotoDb();
      if (idb) {
        await new Promise((resolve) => {
          try {
            const tx = idb.transaction(PHOTO_STORE_NAME, "readwrite");
            tx.objectStore(PHOTO_STORE_NAME).put({
              id: photoId,
              dataUrl,
              name,
              savedAt: Date.now()
            });
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch (e) {
            resolve(false);
          }
        });
      }
      if (db && currentUser && String(dataUrl).length < 950000) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(photoId));
          await setDoc(mediaDocRef, {
            id: photoId,
            kind: "photo",
            dataUrl,
            name,
            updatedAt: Date.now()
          });
        } catch (err) {
          console.warn("Firestore photo save fallback:", err);
        }
      }
      return true;
    }

    async function getPhotoRecordFromDb(photoId) {
      if (!photoId) return null;
      const idb = await openPhotoDb();
      if (idb) {
        const localRec = await new Promise((resolve) => {
          try {
            const tx = idb.transaction(PHOTO_STORE_NAME, "readonly");
            const req = tx.objectStore(PHOTO_STORE_NAME).get(photoId);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
        if (localRec && localRec.dataUrl) {
          return localRec;
        }
      }
      if (db && currentUser) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(photoId));
          const snap = await getDoc(mediaDocRef);
          if (snap.exists()) {
            const d = snap.data();
            if (d && d.dataUrl) {
              return { id: photoId, dataUrl: d.dataUrl, name: d.name || "photo.jpg" };
            }
          }
        } catch (err) {
          console.warn("Firestore photo fetch fallback:", err);
        }
      }
      return null;
    }

    async function deletePhotoFromDb(photoId) {
      if (!photoId) return;
      photoUrlCache.delete(photoId);
      const idb = await openPhotoDb();
      if (idb) {
        try {
          const tx = idb.transaction(PHOTO_STORE_NAME, "readwrite");
          tx.objectStore(PHOTO_STORE_NAME).delete(photoId);
        } catch (e) {}
      }
      if (db && currentUser) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(photoId));
          await deleteDoc(mediaDocRef);
        } catch (e) {}
      }
    }

    function blobToDataUrl(blob) {
      return new Promise((resolve) => {
        if (!(blob instanceof Blob)) {
          resolve("");
          return;
        }
        try {
          const reader = new FileReader();
          reader.onload = (ev) => resolve(String(ev.target?.result || ""));
          reader.onerror = () => resolve("");
          reader.readAsDataURL(blob);
        } catch (e) {
          resolve("");
        }
      });
    }

    async function saveVideoBlobToDb(id, blob, name, mimeType, dataUrl = "") {
      if (!id || !blob) return false;
      const idb = await openVideoDb();
      if (idb) {
        await new Promise((resolve) => {
          try {
            const tx = idb.transaction(VIDEO_STORE_NAME, "readwrite");
            tx.objectStore(VIDEO_STORE_NAME).put({
              id,
              blob,
              dataUrl: dataUrl || "",
              name: name || "video.mp4",
              mimeType: mimeType || blob.type || "video/mp4",
              savedAt: Date.now()
            });
            tx.oncomplete = () => resolve(true);
            tx.onerror = () => resolve(false);
          } catch (e) {
            resolve(false);
          }
        });
      }
      const resolvedDataUrl = dataUrl && dataUrl.startsWith("data:video/")
        ? dataUrl
        : (blob.size <= 550000 ? await blobToDataUrl(blob) : "");
      if (db && currentUser && resolvedDataUrl && resolvedDataUrl.length < 680000) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(id));
          await setDoc(mediaDocRef, {
            id,
            kind: "video",
            dataUrl: resolvedDataUrl,
            name: name || "video.mp4",
            mimeType: mimeType || blob.type || "video/mp4",
            updatedAt: Date.now()
          });
        } catch (err) {
          console.warn("Firestore video save fallback:", err);
        }
      }
      return true;
    }

    async function getVideoRecordFromDb(id) {
      if (!id) return null;
      const idb = await openVideoDb();
      if (idb) {
        const localRec = await new Promise((resolve) => {
          try {
            const tx = idb.transaction(VIDEO_STORE_NAME, "readonly");
            const req = tx.objectStore(VIDEO_STORE_NAME).get(id);
            req.onsuccess = () => resolve(req.result || null);
            req.onerror = () => resolve(null);
          } catch (e) {
            resolve(null);
          }
        });
        if (localRec && (localRec.blob instanceof Blob || localRec.dataUrl)) {
          return localRec;
        }
      }
      if (db && currentUser) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(id));
          const snap = await getDoc(mediaDocRef);
          if (snap.exists()) {
            const d = snap.data();
            if (d && typeof d.dataUrl === "string" && d.dataUrl.startsWith("data:video/")) {
              const blob = dataUrlToBlob(d.dataUrl);
              return {
                id,
                blob,
                dataUrl: d.dataUrl,
                name: d.name || "video.mp4",
                mimeType: d.mimeType || blob.type || "video/mp4"
              };
            }
          }
        } catch (err) {
          console.warn("Firestore video fetch fallback:", err);
        }
      }
      return null;
    }

    async function deleteVideoFromDb(id) {
      if (!id) return;
      const cachedUrl = videoUrlCache.get(id);
      if (cachedUrl && cachedUrl.startsWith("blob:")) {
        try { URL.revokeObjectURL(cachedUrl); } catch (e) {}
      }
      videoUrlCache.delete(id);
      const idb = await openVideoDb();
      if (idb) {
        try {
          const tx = idb.transaction(VIDEO_STORE_NAME, "readwrite");
          tx.objectStore(VIDEO_STORE_NAME).delete(id);
        } catch (e) {}
      }
      if (db && currentUser) {
        try {
          const mediaDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_media", encodeURIComponent(id));
          await deleteDoc(mediaDocRef);
        } catch (e) {}
      }
    }

    function normalizeCityName(rawCity) {
      const val = String(rawCity || "").trim();
      if (!val) return "";
      if (/^(белград|belgrade|онлайн|online|евросайты|евро\s*сайты)/i.test(val)) return "";
      if (/^тбилиси$/i.test(val)) return "Тбилиси";
      return val;
    }

    function getAllowedModelCities() {
      const custom = Array.isArray(state.modelCities) ? state.modelCities : [];
      const merged = [...BASE_MODEL_CITIES];
      custom.forEach((c) => {
        const clean = normalizeCityName(c);
        if (clean && !merged.some((existing) => existing.toLowerCase() === clean.toLowerCase())) {
          merged.push(clean);
        }
      });
      return merged;
    }

    function normalizeModelCity(rawCity, allowedCities = BASE_MODEL_CITIES) {
      const clean = normalizeCityName(rawCity);
      if (!clean) return null;
      const matched = allowedCities.find((c) => c.toLowerCase() === clean.toLowerCase());
      return matched || null;
    }

    function sanitizeModelsList(list, allowedCities = BASE_MODEL_CITIES) {
      if (!Array.isArray(list)) return [];
      return list
        .map((m, mIdx) => {
          if (!m || typeof m !== "object") return null;
          const city = normalizeModelCity(m.city, allowedCities);
          if (!city) return null;
          const modelId = String(m.id || `m_sanitized_${mIdx}`).trim();

          const dedupPhotos = (rawArr, fieldName) => {
            const seenIds = new Set();
            const seenSrcPrefix = new Set();
            const result = [];
            (Array.isArray(rawArr) ? rawArr : []).forEach((p, idx) => {
              const norm = normalizePhotoEntry(p, idx, modelId, fieldName);
              if (!norm || !isUserAddedPhotoId(norm.photoId, modelId, fieldName)) return;
              const srcVal = getPhotoDisplaySrc(norm);
              if (!srcVal || !srcVal.startsWith("data:image/")) return;
              if (seenIds.has(norm.photoId)) return;
              const sig = `${srcVal.length}_${srcVal.slice(0, 96)}_${srcVal.slice(-64)}`;
              if (seenSrcPrefix.has(sig)) return;
              seenIds.add(norm.photoId);
              seenSrcPrefix.add(sig);
              result.push({
                photoId: norm.photoId,
                src: srcVal,
                name: norm.name || `photo_${result.length + 1}.jpg`
              });
            });
            return result;
          };

          const cleanPhotos = dedupPhotos(m.photos, "photos");
          const cleanRoutePhotos = dedupPhotos(m.routePhotos, "routePhotos");
          const cleanVideos = (Array.isArray(m.videos) ? m.videos : [])
            .map((v, idx) => normalizeMediaItem(v, `video_${idx + 1}.mp4`, modelId, "videos"))
            .filter(Boolean);
          const cleanRouteVideos = (Array.isArray(m.routeVideos) ? m.routeVideos : [])
            .map((v, idx) => normalizeMediaItem(v, `route_video_${idx + 1}.mp4`, modelId, "routeVideos"))
            .filter(Boolean);
          return {
            ...m,
            id: modelId,
            city,
            photos: cleanPhotos,
            routePhotos: cleanRoutePhotos,
            videos: cleanVideos,
            routeVideos: cleanRouteVideos,
            description: typeof m.description === "string" ? m.description : ""
          };
        })
        .filter(Boolean);
    }

    function getModelMapUrl(model) {

    function compressImageFiles(fileList, maxSize = 680, quality = 0.64, modelId = "model", fieldName = "photos") {
      const files = Array.from(fileList || []).filter((f) => f && f.type && f.type.startsWith("image/"));
      if (!files.length) return Promise.resolve([]);

      const readSingleFile = (file, fileIdx) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = async (ev) => {
          const rawDataUrl = String(ev.target?.result || "");
          if (!rawDataUrl) {
            resolve(null);
            return;
          }
          const finalizePhoto = async (finalDataUrl) => {
            if (!finalDataUrl || !finalDataUrl.startsWith("data:image/")) return null;
            const uniqueToken = `${USER_ADDED_PHOTO_PREFIX}${Date.now()}_${fileIdx}_${Math.random().toString(36).slice(2, 7)}`;
            const photoId = createMediaScopeKey(modelId, fieldName, uniqueToken);
            photoUrlCache.set(photoId, finalDataUrl);
            await savePhotoDataToDb(photoId, finalDataUrl, file.name || `photo_${fileIdx + 1}.jpg`);
            return {
              photoId,
              src: finalDataUrl,
              name: file.name || `photo_${fileIdx + 1}.jpg`,
              savedAt: Date.now()
            };
          };

          const img = new Image();
          img.onload = async () => {
            try {
              let { width, height } = img;
              if (width > maxSize || height > maxSize) {
                if (width >= height) {
                  height = Math.max(1, Math.round((height * maxSize) / width));
                  width = maxSize;
                } else {
                  width = Math.max(1, Math.round((width * maxSize) / height));
                  height = maxSize;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, width);
              canvas.height = Math.max(1, height);
              const ctx = canvas.getContext("2d");
              if (!ctx) {
                resolve(await finalizePhoto(rawDataUrl));
                return;
              }
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              let dataUrl = canvas.toDataURL("image/jpeg", quality);
              let q = quality;
              let w = canvas.width;
              let h = canvas.height;
              let guard = 0;
              while (dataUrl.length > 78000 && guard < 8) {
                guard += 1;
                w = Math.max(220, Math.round(w * 0.78));
                h = Math.max(220, Math.round(h * 0.78));
                q = Math.max(0.38, q - 0.07);
                canvas.width = w;
                canvas.height = h;
                ctx.drawImage(img, 0, 0, w, h);
                dataUrl = canvas.toDataURL("image/jpeg", q);
              }
              resolve(await finalizePhoto(dataUrl));
            } catch (err) {
              resolve(await finalizePhoto(rawDataUrl));
            }
          };
          img.onerror = async () => {
            if (rawDataUrl.startsWith("data:image/")) {
              resolve(await finalizePhoto(rawDataUrl));
            } else {
              resolve(null);
            }
          };
          img.src = rawDataUrl;
        };
        reader.onerror = () => resolve(null);
        reader.readAsDataURL(file);
      });

      return Promise.all(files.map((f, idx) => readSingleFile(f, idx))).then((items) => items.filter(Boolean));
    }

    async function readVideoFiles(fileList, modelId = "model", fieldName = "videos") {
      const files = Array.from(fileList || []).filter((f) => f && f.type && f.type.startsWith("video/"));
      if (!files.length) return [];

      const results = [];
      for (let i = 0; i < files.length; i += 1) {
        const file = files[i];
        const uniqueToken = `${USER_ADDED_VIDEO_PREFIX}${Date.now()}_${i}_${Math.random().toString(36).slice(2, 7)}`;
        const mediaId = createMediaScopeKey(modelId, fieldName, uniqueToken);
        let objectUrl = "";
        try {
          objectUrl = URL.createObjectURL(file);
          if (objectUrl) {
            videoUrlCache.set(mediaId, objectUrl);
          }
        } catch (err) {
          objectUrl = "";
        }
        const videoDataUrl = file.size <= 350000 ? await blobToDataUrl(file) : "";
        await saveVideoBlobToDb(mediaId, file, file.name || "video.mp4", file.type || "video/mp4", videoDataUrl);
        if (objectUrl || videoDataUrl) {
          results.push({
            mediaId,
            src: objectUrl || videoDataUrl,
            dataUrl: videoDataUrl || "",
            name: file.name || "video.mp4",
            size: file.size || 0
          });
        }
      }
      return results;
    }

    function normalizeMediaItem(item, fallbackName = "media", modelId = "", fieldName = "videos") {
      if (!item) return null;
      if (typeof item === "string") {
        const trimmed = item.trim();
        if (!trimmed) return null;
        return {
          mediaId: modelId ? createMediaScopeKey(modelId, fieldName, `${USER_ADDED_VIDEO_PREFIX}str_0`) : "",
          src: trimmed,
          dataUrl: trimmed.startsWith("data:video/") ? trimmed : "",
          name: fallbackName
        };
      }
      if (typeof item === "object" && (item.src || item.dataUrl || item.mediaId)) {
        let mediaId = String(item.mediaId || "").trim();
        if (modelId && fieldName) {
          if (mediaId && !belongsToModelScope(mediaId, modelId, fieldName)) {
            const suffix = mediaId.replace(/[^a-zA-Z0-9_-]/g, "").slice(-14);
            mediaId = createMediaScopeKey(modelId, fieldName, suffix.startsWith(USER_ADDED_VIDEO_PREFIX) ? suffix : `${USER_ADDED_VIDEO_PREFIX}${suffix || "item"}`);
          } else if (!mediaId) {
            mediaId = createMediaScopeKey(modelId, fieldName, `${USER_ADDED_VIDEO_PREFIX}item`);
          }
        }
        const cachedUrl = mediaId ? videoUrlCache.get(mediaId) : "";
        const rawSrc = String(item.src || "");
        const rawDataUrl = String(item.dataUrl || "");
        const safeSrc = rawSrc.startsWith("blob:")
          ? (cachedUrl || rawDataUrl || "")
          : (rawSrc || cachedUrl || rawDataUrl || "");
        return {
          mediaId,
          src: safeSrc,
          dataUrl: rawDataUrl.startsWith("data:video/") ? rawDataUrl : (rawSrc.startsWith("data:video/") ? rawSrc : ""),
          name: item.name || fallbackName
        };
      }
      return null;
    }

    function dataUrlToBlob(dataUrl) {
      const parts = dataUrl.split(",");
      const mimeMatch = parts[0].match(/:(.*?);/);
      const mime = mimeMatch ? mimeMatch[1] : "image/jpeg";
      const binary = atob(parts[1] || "");
      const len = binary.length;
      const arr = new Uint8Array(len);
      for (let i = 0; i < len; i += 1) {
        arr[i] = binary.charCodeAt(i);
      }
      return new Blob([arr], { type: mime });
    }

    function isMobileDevice() {
      return /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent || "") || Boolean(tg && tg.platform && tg.platform !== "unknown" && tg.platform !== "tdesktop" && tg.platform !== "web");
    }

    async function triggerMediaDownload(itemOrSrc, filename = "file.jpg") {
      const normPhoto = normalizePhotoEntry(itemOrSrc, 0);
      const mediaObj = normPhoto
        ? { src: getPhotoDisplaySrc(normPhoto), mediaId: "", photoId: normPhoto.photoId, name: normPhoto.name || filename }
        : (typeof itemOrSrc === "object" && itemOrSrc !== null
          ? itemOrSrc
          : { src: itemOrSrc, mediaId: "", name: filename });

      let src = String(mediaObj.src || "");
      if (!src && mediaObj.photoId) {
        const recPhoto = await getPhotoRecordFromDb(mediaObj.photoId);
        if (recPhoto && recPhoto.dataUrl) {
          src = recPhoto.dataUrl;
        }
      }
      const outName = mediaObj.name || filename;

      if (mediaObj.mediaId) {
        const rec = await getVideoRecordFromDb(mediaObj.mediaId);
        if (rec && rec.blob instanceof Blob) {
          const idbUrl = URL.createObjectURL(rec.blob);
          if (tg && typeof tg.openLink === "function" && isMobileDevice()) {
            try {
              tg.openLink(idbUrl);
              showToast("Открыто для сохранения");
              return;
            } catch (e) {}
          }
          const a = document.createElement("a");
          a.href = idbUrl;
          a.download = rec.name || outName;
          a.rel = "noopener noreferrer";
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          setTimeout(() => {
            try { URL.revokeObjectURL(idbUrl); } catch (e) {}
          }, 5000);
          showToast("Скачивание запущено");
          return;
        }
      }

      if (!src) {
        showToast("Нет файла для скачивания");
        return;
      }

      try {
        if (src.startsWith("data:")) {
          const blob = dataUrlToBlob(src);
          const blobUrl = URL.createObjectURL(blob);

          if (isMobileDevice() && navigator.share && typeof File === "function") {
            try {
              const fileObj = new File([blob], outName, { type: blob.type || "image/jpeg" });
              if (!navigator.canShare || navigator.canShare({ files: [fileObj] })) {
                await navigator.share({ files: [fileObj], title: outName });
                setTimeout(() => {
                  try { URL.revokeObjectURL(blobUrl); } catch (e) {}
                }, 3000);
                showToast("Сохранение фото");
                return;
              }
            } catch (shareErr) {
              if (shareErr && shareErr.name === "AbortError") {
                try { URL.revokeObjectURL(blobUrl); } catch (e) {}
                return;
              }
            }
          }

          const link = document.createElement("a");
          link.href = blobUrl;
          link.download = outName;
          link.rel = "noopener noreferrer";
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);

          setTimeout(() => {
            try { URL.revokeObjectURL(blobUrl); } catch (e) {}
          }, 5000);
          showToast("Скачивание запущено");
          return;
        }

        const link = document.createElement("a");
        link.href = src;
        link.download = outName;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Скачивание запущено");
      } catch (e) {
        try {
          const newWin = window.open(src, "_blank", "noopener,noreferrer");
          if (!newWin && src.startsWith("data:")) {
            const w = window.open("");
            if (w) {
              w.document.write(`<img src="${src}" style="max-width:100%;height:auto;" />`);
            }
          }
          showToast("Открыто для сохранения");
        } catch (err2) {
          showToast("Не удалось скачать файл");
        }
      }
    }

    function attachVideoGalleryEvents(rootEl, videos, uploadInputId, downloadPrefix, onAddVideos, onRemoveVideo, modelId = "model", fieldName = "videos") {
      const fileInput = rootEl.querySelector(`#${uploadInputId}`);

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) {
          const initial = JSON.parse(JSON.stringify(def));
          initial.modelCities = [...BASE_MODEL_CITIES];
          initial.models = sanitizeModelsList(initial.models, initial.modelCities);
          initial.closings = [];
          initial.weeklyReports = [];
          return initial;
        }
        const parsed = JSON.parse(raw);
        const rawCities = Array.isArray(parsed.modelCities) ? parsed.modelCities : BASE_MODEL_CITIES;
        const normalizedCities = [...BASE_MODEL_CITIES];
        rawCities.forEach((c) => {
          const clean = normalizeCityName(c);
          if (clean && !normalizedCities.some((ex) => ex.toLowerCase() === clean.toLowerCase())) {
            normalizedCities.push(clean);
          }
        });
        const sanitizedModels = Array.isArray(parsed.models)
          ? sanitizeModelsList(parsed.models, normalizedCities)
          : sanitizeModelsList(def.models, normalizedCities);
        const normalizedState = {
          bl: Array.isArray(parsed.bl) ? parsed.bl : def.bl,
          models: sanitizedModels,
          modelCities: normalizedCities,
          team: Array.isArray(parsed.team) ? parsed.team : def.team,
          rules: Array.isArray(parsed.rules) ? parsed.rules : def.rules,
          fines: Array.isArray(parsed.fines) ? parsed.fines : def.fines,
          paymentMethods: Array.isArray(parsed.paymentMethods) && parsed.paymentMethods.length > 0
            ? parsed.paymentMethods
            : JSON.parse(JSON.stringify(def.paymentMethods)),
          oneTimeCodes: Array.isArray(parsed.oneTimeCodes) && parsed.oneTimeCodes.length > 0
            ? parsed.oneTimeCodes
            : JSON.parse(JSON.stringify(def.oneTimeCodes)),
          acc: Array.isArray(parsed.acc) ? parsed.acc : [],
          shifts: Array.isArray(parsed.shifts) ? parsed.shifts : [],
          closings: Array.isArray(parsed.closings) ? parsed.closings : [],
          weeklyReports: Array.isArray(parsed.weeklyReports) ? parsed.weeklyReports : []
        };
        return normalizedState;
      } catch (e) {
        const fallback = JSON.parse(JSON.stringify(def));
        fallback.modelCities = [...BASE_MODEL_CITIES];
        fallback.models = sanitizeModelsList(fallback.models, fallback.modelCities);
        fallback.closings = [];
        fallback.weeklyReports = [];
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = String(message || "");
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("show");
      }, 2200);
    }

    function copyText(text) {
      const value = String(text ?? "");
      if (!value) {
        showToast("Нечего копировать");
        return;
      }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(value).then(() => {
          showToast("Скопировано");
        }).catch(() => {
          fallbackCopyText(value);
        });
      } else {
        fallbackCopyText(value);
      }
    }

    function fallbackCopyText(value) {
      try {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Скопировано");
      } catch (e) {
        showToast("Не удалось скопировать");
      }
    }

    function serializePhotoForStorage(p, idx = 0, includeImageData = true, modelId = "", fieldName = "photos") {
      const norm = normalizePhotoEntry(p, idx, modelId, fieldName);
      if (!norm || !isUserAddedPhotoId(norm.photoId, modelId, fieldName)) return null;
      const recFromCache = norm.photoId ? photoUrlCache.get(norm.photoId) : "";
      const srcVal = String(norm.src || recFromCache || "").trim();
      if (!srcVal || !srcVal.startsWith("data:image/")) return null;
      if (norm.photoId) {
        photoUrlCache.set(norm.photoId, srcVal);
        void savePhotoDataToDb(norm.photoId, srcVal, norm.name);
      }
      return {
        photoId: norm.photoId,
        mediaRef: norm.photoId,
        name: norm.name || `photo_${idx + 1}.jpg`,
        src: includeImageData ? srcVal : ""
      };
    }

    function buildSyncableState(srcState, { includePhotos = true } = {}) {
      return {
        ...srcState,
        models: Array.isArray(srcState.models)
          ? srcState.models.map((m, mIdx) => {
              const mId = String(m?.id || `m_sync_${mIdx}`).trim();
              return {
                ...m,
                id: mId,
                photos: Array.isArray(m.photos)
                  ? m.photos
                      .map((p, idx) => serializePhotoForStorage(p, idx, includePhotos, mId, "photos"))
                      .filter(Boolean)
                  : [],
                routePhotos: Array.isArray(m.routePhotos)
                  ? m.routePhotos
                      .map((p, idx) => serializePhotoForStorage(p, idx, includePhotos, mId, "routePhotos"))
                      .filter(Boolean)
                  : [],
                videos: Array.isArray(m.videos)
                  ? m.videos
                      .map((v, idx) => normalizeMediaItem(v, `${mId}__videos__video_${idx + 1}.mp4`, mId, "videos"))
                      .filter(Boolean)
                  : [],
                routeVideos: Array.isArray(m.routeVideos)
                  ? m.routeVideos
                      .map((v, idx) => normalizeMediaItem(v, `${mId}__routeVideos__route_video_${idx + 1}.mp4`, mId, "routeVideos"))
                      .filter(Boolean)
                  : []
              };
            })
          : []
      };
    }

    function saveState() {
      if (isApplyingRemoteSnapshot) return;
      lastLocalMutationAt = Date.now();
      const fullPayload = buildSyncableState(state, { includePhotos: true });
      try {
        localStorage.setItem(STORE_KEY, JSON.stringify(fullPayload));
      } catch (e) {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(buildSyncableState(state, { includePhotos: false })));
        } catch (e2) {}
      }
      if (sharedDocRef && currentUser) {
        void pushStateToCloud(fullPayload);
      }
    }

    async function pushStateToCloud(payloadState) {
      if (!sharedDocRef || !currentUser) return;
      try {
        // Сначала гарантируем сохранение каждого фото в отдельный документ коллекции tabu_group_media
        if (Array.isArray(payloadState?.models)) {
          for (const m of payloadState.models) {
            for (const f of ["photos", "routePhotos"]) {
              for (const p of (Array.isArray(m?.[f]) ? m[f] : [])) {
                if (p && p.photoId && typeof p.src === "string" && p.src.startsWith("data:image/")) {
                  await savePhotoDataToDb(p.photoId, p.src, p.name || "photo.jpg");
                }
              }
            }
          }
        }
        let serialized = JSON.stringify(payloadState);
        if (serialized.length > 920000) {
          const compactPayload = buildSyncableState(payloadState, { includePhotos: false });
          serialized = JSON.stringify(compactPayload);
        }
        await setDoc(
          sharedDocRef,
          {
            dataJson: serialized,
            updatedAt: Date.now(),
            updatedBy: currentUser.uid || "anonymous"
          },
          { merge: true }
        );
        setSyncStatus("Синхронизация: общая база онлайн");
      } catch (err) {
        console.error("Failed to push state to cloud:", err);
        setSyncStatus("Синхронизация: ошибка записи");
      }
    }

    function mergePhotosPreservingLocal(remoteList, localList, modelId = "", fieldName = "photos") {
      const remArr = (Array.isArray(remoteList) ? remoteList : [])
        .map((p, idx) => normalizePhotoEntry(p, idx, modelId, fieldName))
        .filter((p) => p && isUserAddedPhotoId(p.photoId, modelId, fieldName));
      const locArr = (Array.isArray(localList) ? localList : [])
        .map((p, idx) => normalizePhotoEntry(p, idx, modelId, fieldName))
        .filter((p) => p && isUserAddedPhotoId(p.photoId, modelId, fieldName));

      const localById = new Map();
      locArr.forEach((lp) => {
        if (lp.photoId) localById.set(lp.photoId, lp);
      });

      const seenIds = new Set();
      const seenSigs = new Set();
      const merged = [];

      const pushUniquePhoto = (photoObj) => {
        if (!photoObj || !photoObj.photoId) return;
        if (seenIds.has(photoObj.photoId)) return;
        const cached = photoUrlCache.get(photoObj.photoId) || "";
        const srcVal = String(photoObj.src || cached || "").trim();
        if (!srcVal || !srcVal.startsWith("data:image/")) return;
        const sig = `${srcVal.length}_${srcVal.slice(0, 96)}_${srcVal.slice(-64)}`;
        if (seenSigs.has(sig)) return;
        seenIds.add(photoObj.photoId);
        seenSigs.add(sig);
        photoUrlCache.set(photoObj.photoId, srcVal);
        void savePhotoDataToDb(photoObj.photoId, srcVal, photoObj.name || "photo.jpg");
        merged.push({
          photoId: photoObj.photoId,
          src: srcVal,
          name: photoObj.name || "photo.jpg"
        });
      };

      remArr.forEach((rp) => {
        const cachedSrc = rp.photoId ? photoUrlCache.get(rp.photoId) : "";
        const localMatch = rp.photoId ? localById.get(rp.photoId) : null;
        const bestSrc = rp.src || cachedSrc || (localMatch ? localMatch.src : "");
        pushUniquePhoto({
          photoId: rp.photoId,
          src: bestSrc,
          name: rp.name || (localMatch ? localMatch.name : "photo.jpg")
        });
      });

      locArr.forEach((lp) => {
        pushUniquePhoto(lp);
      });

      return merged;
    }

    function mergeVideosPreservingLocal(remoteList, localList, modelId = "", fieldName = "videos") {
      const remArr = (Array.isArray(remoteList) ? remoteList : [])
        .map((v, idx) => normalizeMediaItem(v, `${fieldName}_${idx + 1}.mp4`, modelId, fieldName))
        .filter(Boolean)
        .filter((v) => !modelId || !v.mediaId || belongsToModelScope(v.mediaId, modelId, fieldName));
      const locArr = (Array.isArray(localList) ? localList : [])
        .map((v, idx) => normalizeMediaItem(v, `${fieldName}_${idx + 1}.mp4`, modelId, fieldName))
        .filter(Boolean)
        .filter((v) => !modelId || !v.mediaId || belongsToModelScope(v.mediaId, modelId, fieldName));

      const localById = new Map();
      locArr.forEach((lv) => {
        if (lv.mediaId) localById.set(lv.mediaId, lv);
      });

      const merged = remArr.map((rv) => {
        const cachedUrl = rv.mediaId ? videoUrlCache.get(rv.mediaId) : "";
        const localMatch = rv.mediaId ? localById.get(rv.mediaId) : null;
        const bestSrc = rv.src || rv.dataUrl || cachedUrl || (localMatch ? (localMatch.src || localMatch.dataUrl) : "");
        return {
          mediaId: rv.mediaId || (localMatch ? localMatch.mediaId : ""),
          src: bestSrc,
          dataUrl: rv.dataUrl || (localMatch ? localMatch.dataUrl : ""),
          name: rv.name || (localMatch ? localMatch.name : "video.mp4")
        };
      });

      const mergedIds = new Set(merged.map((m) => m.mediaId).filter(Boolean));
      locArr.forEach((lv) => {
        if (!lv.mediaId || !mergedIds.has(lv.mediaId)) {
          merged.push(lv);
        }
      });

      return merged;
    }

    async function initSharedGroupSync() {
      if (!hasFirebaseConfig) {
        setSyncStatus("Синхронизация: локальный режим");
        return;
      }

      try {
        const firebaseConfig = typeof rawFirebaseConfig === "string"
          ? JSON.parse(rawFirebaseConfig)
          : rawFirebaseConfig;

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        setSyncStatus("Синхронизация: вход...");
        if (initialAuthToken) {
          try {
            await signInWithCustomToken(auth, initialAuthToken);
          } catch (customTokenErr) {
            console.warn("Custom token sign-in failed, falling back to anonymous auth:", customTokenErr);
            await signInAnonymously(auth);
          }
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          setSyncStatus("Синхронизация: нет доступа");
          return;
        }

        sharedDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_state", "main");

        const existingSnap = await getDoc(sharedDocRef);
        if (!existingSnap.exists()) {
          await pushStateToCloud(buildSyncableState(state, { includePhotos: true }));
        }

        onSnapshot(
          sharedDocRef,
          (docSnap) => {
            if (!docSnap.exists()) return;
            if (Date.now() - lastLocalMutationAt < 1200) {
              setSyncStatus("Синхронизация: общая база онлайн");
              return;
            }
            const rawDoc = docSnap.data();
            let parsedRemote = null;
            try {
              if (typeof rawDoc.dataJson === "string" && rawDoc.dataJson.trim()) {
                parsedRemote = JSON.parse(rawDoc.dataJson);
              } else if (rawDoc.state && typeof rawDoc.state === "object") {
                parsedRemote = rawDoc.state;
              }
            } catch (parseErr) {
              console.error("Failed to parse remote state:", parseErr);
              return;
            }

            if (!parsedRemote) return;

            const normalizedRemote = {
              bl: Array.isArray(parsedRemote.bl) ? parsedRemote.bl : def.bl,
              models: sanitizeModelsList(
                Array.isArray(parsedRemote.models) ? parsedRemote.models : def.models,
                Array.isArray(parsedRemote.modelCities) && parsedRemote.modelCities.length > 0
                  ? parsedRemote.modelCities
                  : BASE_MODEL_CITIES
              ),
              modelCities: Array.isArray(parsedRemote.modelCities) && parsedRemote.modelCities.length > 0
                ? parsedRemote.modelCities
                : [...BASE_MODEL_CITIES],
              team: Array.isArray(parsedRemote.team) ? parsedRemote.team : def.team,
              rules: Array.isArray(parsedRemote.rules) ? parsedRemote.rules : def.rules,
              fines: Array.isArray(parsedRemote.fines) ? parsedRemote.fines : def.fines,
              paymentMethods: Array.isArray(parsedRemote.paymentMethods) && parsedRemote.paymentMethods.length > 0
                ? parsedRemote.paymentMethods
                : JSON.parse(JSON.stringify(def.paymentMethods)),
              oneTimeCodes: Array.isArray(parsedRemote.oneTimeCodes) && parsedRemote.oneTimeCodes.length > 0
                ? parsedRemote.oneTimeCodes
                : JSON.parse(JSON.stringify(def.oneTimeCodes)),
              acc: Array.isArray(parsedRemote.acc) ? parsedRemote.acc : [],
              shifts: Array.isArray(parsedRemote.shifts) ? parsedRemote.shifts : [],
              closings: Array.isArray(parsedRemote.closings) ? parsedRemote.closings : [],
              weeklyReports: Array.isArray(parsedRemote.weeklyReports) ? parsedRemote.weeklyReports : []
            };

            const localModelsById = new Map();
            (state.models || []).forEach((lm) => {
              if (lm && lm.id) {
                localModelsById.set(lm.id, lm);
              }
            });

            normalizedRemote.models = (normalizedRemote.models || []).map((rm) => {
              const localM = localModelsById.get(rm.id);
              const localPhotos = localM ? localM.photos : [];
              const localRoutePhotos = localM ? localM.routePhotos : [];
              const localVideos = localM ? localM.videos : [];
              const localRouteVideos = localM ? localM.routeVideos : [];
              return {
                ...rm,
                photos: mergePhotosPreservingLocal(rm.photos, localPhotos, rm.id, "photos"),
                routePhotos: mergePhotosPreservingLocal(rm.routePhotos, localRoutePhotos, rm.id, "routePhotos"),
                videos: mergeVideosPreservingLocal(rm.videos, localVideos, rm.id, "videos"),
                routeVideos: mergeVideosPreservingLocal(rm.routeVideos, localRouteVideos, rm.id, "routeVideos")
              };
            });

            const remoteSerialized = JSON.stringify(buildSyncableState(normalizedRemote, { includePhotos: false }));
            const currentSerialized = JSON.stringify(buildSyncableState(state, { includePhotos: false }));

            if (remoteSerialized !== currentSerialized) {
              isApplyingRemoteSnapshot = true;
              try {
                state = normalizedRemote;
                void hydrateStoredPhotos(state.models);
                void hydrateStoredVideos(state.models);
                try {
                  localStorage.setItem(STORE_KEY, JSON.stringify(buildSyncableState(state, { includePhotos: false })));
                } catch (lsErr) {}
                renderMain();
              } finally {
                isApplyingRemoteSnapshot = false;
              }
            } else {
              void hydrateStoredPhotos(normalizedRemote.models);
              void hydrateStoredVideos(normalizedRemote.models);
            }
            setSyncStatus("Синхронизация: общая база онлайн");
          },
          (snapErr) => {
            console.error("Shared snapshot error:", snapErr);
            setSyncStatus("Синхронизация: переподключение...");
          }
        );
      } catch (initErr) {
        console.error("Shared sync init error:", initErr);
        setSyncStatus("Синхронизация: офлайн / локально");
      }
    }
