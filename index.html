<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Tabu — Операционная панель</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;0,700;1,600&family=Inter+Tight:wght@400;500;600;700&family=Ponomar&family=Triodion&display=swap" rel="stylesheet" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: #e8e8e8;
      --surface: #f6f6f6;
      --surface-elevated: #ffffff;
      --text: #141414;
      --text-secondary: #5c5c5c;
      --text-muted: #8a8a8a;
      --accent: #1b1b1b;
      --accent-soft: #ebebeb;
      --border: #dcdcdc;
      --danger: #d9383a;
      --danger-soft: #fdecec;
      --success: #1f8b4c;
      --success-soft: #e7f6ed;
      --font-calligraphy: 'Triodion', 'Ponomar', 'Cormorant Garamond', Georgia, serif;
      --radius-lg: 20px;
      --radius-md: 14px;
      --radius-sm: 10px;
      --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.04);
      --shadow-md: 0 8px 24px rgba(0, 0, 0, 0.08);
      --transition: 0.24s cubic-bezier(0.22, 1, 0.36, 1);
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
      margin: 0;
      padding: 0;
    }

    html, body {
      height: 100%;
      background-color: var(--bg);
      color: var(--text);
      font-family: 'Inter Tight', -apple-system, BlinkMacSystemFont, sans-serif;
      font-size: 15px;
      line-height: 1.4;
      overflow-x: hidden;
      -webkit-font-smoothing: antialiased;
    }

    /* App Container */
    .app-shell {
      max-width: 520px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(84px + env(safe-area-inset-bottom));
    }

    /* Header */
    .app-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(232, 232, 232, 0.86);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      padding: 14px 16px 10px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-badge {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      background: var(--accent);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 16px;
      letter-spacing: -0.02em;
      box-shadow: var(--shadow-sm);
    }

    .brand-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .brand-sub {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .icon-btn {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: transform 0.15s ease, background-color 0.2s ease;
    }

    .icon-btn:active {
      transform: scale(0.93);
      background: var(--accent-soft);
    }

    /* Main Content Area */
    .main-view {
      flex: 1;
      padding: 12px 16px 24px;
    }

    .section-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 12px;
      gap: 10px;
    }

    .section-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    .section-count {
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      background: var(--surface);
      padding: 4px 10px;
      border-radius: 999px;
      border: 1px solid var(--border);
    }

    /* Search & Filter Bar */
    .search-wrap {
      position: relative;
      margin-bottom: 12px;
    }

    .search-input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 38px 11px 38px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color var(--transition), background-color var(--transition);
    }

    .search-input:focus {
      border-color: var(--accent);
      background: var(--surface-elevated);
    }

    .search-icon {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .clear-search {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: none;
      background: var(--accent-soft);
      color: var(--text-secondary);
      font-size: 13px;
      display: none;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .clear-search.visible {
      display: inline-flex;
    }

    /* Filter Chips */
    .chips-row {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 10px;
      scrollbar-width: none;
    }

    .chips-row::-webkit-scrollbar {
      display: none;
    }

    .chip {
      flex-shrink: 0;
      padding: 7px 14px;
      border-radius: 999px;
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      background: var(--surface);
      color: var(--text-secondary);
      border: 1px solid var(--border);
      cursor: pointer;
      transition: all var(--transition);
    }

    .chip.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--accent);
    }

    /* Cards */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      animation: fadeSlideIn 0.26s ease;
    }

    @keyframes fadeSlideIn {
      from {
        opacity: 0;
        transform: translateY(6px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px 16px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.16s ease, background-color 0.2s ease;
      position: relative;
      overflow: hidden;
    }

    .card.clickable {
      cursor: pointer;
    }

    .card.clickable:active {
      transform: scale(0.985);
      background: var(--surface-elevated);
    }

    .card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
    }

    .card-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: -0.01em;
    }

    .card-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-top: 3px;
      line-height: 1.42;
    }

    .card-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 4px 9px;
      border-radius: 8px;
      background: var(--accent-soft);
      color: var(--text);
    }

    .pill.danger {
      background: var(--danger-soft);
      color: var(--danger);
    }

    .pill.success {
      background: var(--success-soft);
      color: var(--success);
    }

    /* Action Buttons inside Cards */
    .card-actions {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
    }

    .mini-btn {
      padding: 6px 11px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: var(--font-calligraphy);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      transition: transform 0.14s ease, background-color 0.2s ease;
    }

    .mini-btn:active {
      transform: scale(0.94);
    }

    .mini-btn.danger {
      color: var(--danger);
      border-color: rgba(217, 56, 58, 0.25);
      background: var(--danger-soft);
    }

    .mini-btn.status-on {
      background: var(--success-soft);
      color: var(--success);
      border-color: rgba(31, 139, 76, 0.25);
    }

    .mini-btn.status-off {
      background: var(--accent-soft);
      color: var(--text-secondary);
    }

    /* Primary Floating / Section Button */
    .btn-primary {
      background: var(--accent);
      color: #ffffff;
      border: none;
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-family: var(--font-calligraphy);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: var(--shadow-sm);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .btn-primary:active {
      transform: scale(0.97);
      opacity: 0.9;
    }

    .btn-secondary {
      background: var(--surface);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 11px 16px;
      font-family: var(--font-calligraphy);
      font-size: 16px;
      font-weight: 600;
      letter-spacing: 0.03em;
      line-height: 1.15;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    /* Sub-tabs inside Info / Finance */
    .segmented {
      display: flex;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 4px;
      margin-bottom: 14px;
      gap: 4px;
    }

    .seg-btn {
      flex: 1;
      padding: 8px 10px;
      border-radius: 10px;
      border: none;
      background: transparent;
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 0.02em;
      line-height: 1.15;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all var(--transition);
    }

    .seg-btn.active {
      background: var(--accent);
      color: #ffffff;
      box-shadow: var(--shadow-sm);
    }

    /* Stats Summary Grid */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .stat-box {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      padding: 14px;
    }

    .stat-label {
      font-size: 12px;
      color: var(--text-secondary);
      font-weight: 500;
    }

    .stat-val {
      font-size: 20px;
      font-weight: 700;
      margin-top: 4px;
      letter-spacing: -0.02em;
    }

    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100%;
      max-width: 520px;
      background: rgba(246, 246, 246, 0.92);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      padding: 8px 6px calc(8px + env(safe-area-inset-bottom));
      z-index: 30;
    }

    .nav-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-family: var(--font-calligraphy);
      font-size: 13.5px;
      font-weight: 600;
      letter-spacing: 0.025em;
      line-height: 1.1;
      padding: 4px 2px;
      cursor: pointer;
      transition: color 0.2s ease, transform 0.15s ease;
    }

    .nav-item.active {
      color: var(--accent);
    }

    .nav-item:active {
      transform: scale(0.92);
    }

    .nav-icon-wrap {
      width: 38px;
      height: 26px;
      border-radius: 999px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background-color 0.2s ease;
    }

    .nav-item.active .nav-icon-wrap {
      background: var(--accent);
      color: #ffffff;
    }

    /* Bottom Sheet Modal */
    .sheet-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(20, 20, 20, 0.45);
      backdrop-filter: blur(4px);
      z-index: 50;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .sheet-backdrop.open {
      opacity: 1;
      pointer-events: auto;
    }

    .sheet {
      width: 100%;
      max-width: 520px;
      max-height: 88vh;
      background: var(--surface);
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      padding: 12px 18px calc(24px + env(safe-area-inset-bottom));
      box-shadow: var(--shadow-md);
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
    }

    .sheet-backdrop.open .sheet {
      transform: translateY(0);
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 999px;
      background: var(--border);
      margin: 0 auto 14px;
    }

    .sheet-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      gap: 10px;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Form Controls inside Sheet */
    .form-group {
      margin-bottom: 12px;
    }

    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 10px 12px;
      font-family: inherit;
      font-size: 14px;
      color: var(--text);
      outline: none;
    }

    .form-control:focus {
      border-color: var(--accent);
    }

    textarea.form-control {
      min-height: 76px;
      resize: vertical;
    }

    /* Model Detail Sheet Blocks */
    .detail-block {
      background: var(--surface-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      padding: 12px 14px;
      margin-bottom: 10px;
    }

    .detail-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.04em;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .detail-value {
      font-size: 14px;
      color: var(--text);
      font-weight: 500;
      line-height: 1.45;
      white-space: pre-line;
    }

    /* Model Photo Strip & Gallery */
    .model-card-photos {
      display: flex;
      gap: 7px;
      margin-top: 10px;
      overflow-x: auto;
      padding-bottom: 2px;
      scrollbar-width: none;
    }

    .model-card-photos::-webkit-scrollbar {
      display: none;
    }

    .model-thumb {
      width: 58px;
      height: 74px;
      border-radius: 10px;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
      background: var(--accent-soft);
    }

    .photo-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      margin-top: 8px;
    }

    .photo-tile {
      position: relative;
      border-radius: 14px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      aspect-ratio: 3 / 4;
    }

    .photo-tile img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .photo-tile video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      background: #0f0f12;
    }

    .photo-tile-overlay {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      padding: 7px 8px;
      background: linear-gradient(180deg, rgba(0, 0, 0, 0) 0%, rgba(12, 12, 15, 0.84) 100%);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }

    .photo-action-btn {
      padding: 5px 8px;
      border-radius: 8px;
      border: 1px solid rgba(255, 255, 255, 0.24);
      background: rgba(24, 24, 28, 0.88);
      color: #ffffff;
      font-family: var(--font-calligraphy);
      font-size: 13px;
      font-weight: 600;
      line-height: 1.1;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .photo-action-btn.del {
      background: rgba(217, 56, 58, 0.9);
      border-color: rgba(255, 160, 160, 0.35);
    }

    .model-card-header-row {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .model-card-cover {
      width: 66px;
      height: 86px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid var(--border);
      background: var(--accent-soft);
      flex-shrink: 0;
    }

    .model-quick-strip {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 10px;
    }

    .upload-dropzone {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      padding: 12px;
      border-radius: var(--radius-md);
      border: 1px dashed var(--border);
      background: var(--surface-elevated);
      color: var(--text);
      font-family: var(--font-calligraphy);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
    }

    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 12px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      top: 16px;
      left: 50%;
      transform: translateX(-50%) translateY(-80px);
      background: var(--accent);
      color: #ffffff;
      padding: 10px 16px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: var(--shadow-md);
      z-index: 90;
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      pointer-events: none;
      max-width: 90vw;
      text-align: center;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* Edge / Side Payment Note Tab */
    .side-edge-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      z-index: 35;
      background: var(--accent);
      color: #ffffff;
      border: 1px solid rgba(255, 255, 255, 0.16);
      border-right: none;
      border-top-left-radius: 14px;
      border-bottom-left-radius: 14px;
      padding: 12px 7px;
      font-family: var(--font-calligraphy);
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 0.04em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      box-shadow: var(--shadow-md);
      cursor: pointer;
      transition: transform var(--transition), background-color 0.2s ease, padding var(--transition);
    }

    .side-edge-tab.otc-edge-tab {
      top: calc(50% + 96px);
      background: #282828;
    }

    .side-edge-tab:active {
      transform: translateY(-50%) translateX(-2px) scale(0.96);
    }

    .side-note-drawer {
      position: fixed;
      inset: 0;
      z-index: 55;
      background: rgba(20, 20, 20, 0.42);
      backdrop-filter: blur(4px);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.24s ease;
      display: flex;
      justify-content: flex-end;
    }

    .side-note-drawer.open {
      opacity: 1;
      pointer-events: auto;
    }

    .side-note-panel {
      width: min(92vw, 390px);
      height: 100%;
      background: var(--surface);
      border-left: 1px solid var(--border);
      box-shadow: var(--shadow-md);
      padding: 18px 16px calc(24px + env(safe-area-inset-bottom));
      transform: translateX(100%);
      transition: transform 0.28s cubic-bezier(0.22, 1, 0.36, 1);
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .side-note-drawer.open .side-note-panel {
      transform: translateX(0);
    }

    /* Empty State */
    .empty-state {
      text-align: center;
      padding: 36px 20px;
      background: var(--surface);
      border: 1px dashed var(--border);
      border-radius: var(--radius-lg);
      color: var(--text-secondary);
    }

    .empty-state-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 6px;
    }

    .empty-state-sub {
      font-size: 13px;
      line-height: 1.45;
    }

    /* Ripple effect */
    .ripple {
      position: relative;
      overflow: hidden;
    }
    .ripple-ink {
      position: absolute;
      border-radius: 50%;

    const BASE_MODEL_CITIES = ["Тбилиси"];

    function normalizeCityName(rawCity) {
      const val = String(rawCity || "").trim();
      if (!val) return "";
      if (/^(белград|belgrade|онлайн|online|евросайты|евро\s*сайты)/i.test(val)) return "";
      if (/^тбилиси$/i.test(val)) return "Тбилиси";
      return val;
    }

    function getAllowedModelCities() {
      const custom = Array.isArray(state.modelCities) ? state.modelCities : [];
      const merged = [...BASE_MODEL_CITIES];
      custom.forEach((c) => {
        const clean = normalizeCityName(c);
        if (clean && !merged.some((existing) => existing.toLowerCase() === clean.toLowerCase())) {
          merged.push(clean);
        }
      });
      return merged;
    }

    function normalizeModelCity(rawCity, allowedCities = BASE_MODEL_CITIES) {
      const clean = normalizeCityName(rawCity);
      if (!clean) return null;
      const matched = allowedCities.find((c) => c.toLowerCase() === clean.toLowerCase());
      return matched || null;
    }

    function sanitizeModelsList(list, allowedCities = BASE_MODEL_CITIES) {
      if (!Array.isArray(list)) return [];
      return list
        .map((m) => {
          if (!m || typeof m !== "object") return null;
          const city = normalizeModelCity(m.city, allowedCities);
          if (!city) return null;
          return {
            ...m,
            city,
            photos: Array.isArray(m.photos) ? m.photos : [],
            routePhotos: Array.isArray(m.routePhotos) ? m.routePhotos : [],
            videos: Array.isArray(m.videos) ? m.videos : [],
            routeVideos: Array.isArray(m.routeVideos) ? m.routeVideos : [],
            description: typeof m.description === "string" ? m.description : ""
          };
        })
        .filter(Boolean);
    }
    function getModelMapUrl(model) {
      const customLink = String(model?.mapLink || "").trim();
      if (customLink) return customLink;
      const addr = String(model?.address || "").split("\n")[0].trim();
      const city = String(model?.city || "").trim();
      const query = [addr, city].filter(Boolean).join(", ");
      if (!query) return "";
      return `https://maps.google.com/?q=${encodeURIComponent(query)}`;
    }

    function buildModelClientText(model) {
      if (!model) return "";
      const customDesc = String(model.description || "").trim();
      if (customDesc) return customDesc;
      const lines = [
        model.name ? `Модель: ${model.name}` : "",
        model.city ? `Город: ${model.city}` : "",
        model.meta ? `Параметры: ${model.meta}` : "",
        model.district ? `Район: ${model.district}` : "",
        model.incall ? `Incall: ${model.incall}` : "",
        model.outcall ? `Outcall: ${model.outcall}` : "",
        model.services ? `Услуги: ${model.services}` : "",
        model.extras ? `Допы: ${model.extras}` : ""
      ].filter(Boolean);
      return lines.join("\n");
    }

    function compressImageFiles(fileList, maxSize = 960, quality = 0.78) {
      const files = Array.from(fileList || []).filter((f) => f && f.type && f.type.startsWith("image/"));
      if (!files.length) return Promise.resolve([]);

      const readSingleFile = (file) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (ev) => {
          const img = new Image();
          img.onload = () => {
            try {
              let { width, height } = img;
              if (width > maxSize || height > maxSize) {
                if (width >= height) {
                  height = Math.round((height * maxSize) / width);
                  width = maxSize;
                } else {
                  width = Math.round((width * maxSize) / height);
                  height = maxSize;
                }
              }
              const canvas = document.createElement("canvas");
              canvas.width = Math.max(1, width);
              canvas.height = Math.max(1, height);
              const ctx = canvas.getContext("2d");
              if (!ctx) {
                resolve(String(ev.target?.result || ""));
                return;
              }
              ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
              resolve(canvas.toDataURL("image/jpeg", quality));
            } catch (err) {
              resolve(String(ev.target?.result || ""));
            }
          };
          img.onerror = () => resolve("");
          img.src = String(ev.target?.result || "");
        };
        reader.onerror = () => resolve("");
        reader.readAsDataURL(file);
      });

      return Promise.all(files.map(readSingleFile)).then((items) => items.filter(Boolean));
    }

    function readVideoFiles(fileList) {
      const files = Array.from(fileList || []).filter((f) => f && f.type && f.type.startsWith("video/"));
      if (!files.length) return Promise.resolve([]);

      const readSingleVideo = (file) => new Promise((resolve) => {
        try {
          const objectUrl = URL.createObjectURL(file);
          resolve({
            src: objectUrl,
            name: file.name || "video.mp4",
            size: file.size || 0
          });
        } catch (err) {
          resolve(null);
        }
      });

      return Promise.all(files.map(readSingleVideo)).then((items) => items.filter(Boolean));
    }

    function normalizeMediaItem(item, fallbackName = "media") {
      if (!item) return null;
      if (typeof item === "string") {
        return { src: item, name: fallbackName };
      }
      if (typeof item === "object" && item.src) {
        return { src: item.src, name: item.name || fallbackName };
      }
      return null;
    }

    function triggerPhotoDownload(src, filename = "photo.jpg") {
      if (!src) {
        showToast("Нет файла для скачивания");
        return;
      }
      try {
        const link = document.createElement("a");
        link.href = src;
        link.download = filename;
        link.target = "_blank";
        link.rel = "noopener noreferrer";
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast("Скачивание запущено");
      } catch (e) {
        showToast("Не удалось скачать фото");
      }
    }

    function attachPhotoGalleryEvents(rootEl, photos, uploadInputId, downloadPrefix, onAddFiles, onRemovePhoto) {
      const fileInput = rootEl.querySelector(`#${uploadInputId}`);
      if (fileInput) {
        fileInput.addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          showToast("Обработка фото...");
          const compressed = await compressImageFiles(files);
          if (!compressed.length) {
            showToast("Не удалось загрузить фото");
            return;
          }
          onAddFiles(compressed);
        });
      }

      rootEl.querySelectorAll(".dl-photo-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.idx);
          const src = photos[idx];
          triggerPhotoDownload(src, `${downloadPrefix}_${idx + 1}.jpg`);
        });
      });

      rootEl.querySelectorAll(".rm-photo-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.idx);
          onRemovePhoto(idx);
        });
      });
    }

    function attachVideoGalleryEvents(rootEl, videos, uploadInputId, downloadPrefix, onAddVideos, onRemoveVideo) {
      const fileInput = rootEl.querySelector(`#${uploadInputId}`);
      if (fileInput) {
        fileInput.addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          showToast("Загрузка видео...");
          const loaded = await readVideoFiles(files);
          if (!loaded.length) {
            showToast("Не удалось загрузить видео");
            return;
          }
          onAddVideos(loaded);
        });
      }

      const normalized = (Array.isArray(videos) ? videos : [])
        .map((v, idx) => normalizeMediaItem(v, `${downloadPrefix}_${idx + 1}.mp4`))
        .filter(Boolean);

      rootEl.querySelectorAll(".dl-vid-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.idx);
          const item = normalized[idx];
          if (item) {
            triggerPhotoDownload(item.src, item.name || `${downloadPrefix}_${idx + 1}.mp4`);
          }
        });
      });

      rootEl.querySelectorAll(".rm-vid-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const idx = Number(btn.dataset.idx);
          onRemoveVideo(idx);
        });
      });

    function loadState() {
      try {
        const raw = localStorage.getItem(STORE_KEY);
        if (!raw) {
          const initial = JSON.parse(JSON.stringify(def));
          initial.modelCities = [...BASE_MODEL_CITIES];
          initial.models = sanitizeModelsList(initial.models, initial.modelCities);
          initial.closings = [];
          initial.weeklyReports = [];
          return initial;
        }
        const parsed = JSON.parse(raw);
        const rawCities = Array.isArray(parsed.modelCities) ? parsed.modelCities : BASE_MODEL_CITIES;
        const normalizedCities = [...BASE_MODEL_CITIES];
        rawCities.forEach((c) => {
          const clean = normalizeCityName(c);
          if (clean && !normalizedCities.some((ex) => ex.toLowerCase() === clean.toLowerCase())) {
            normalizedCities.push(clean);
          }
        });
        const sanitizedModels = Array.isArray(parsed.models)
          ? sanitizeModelsList(parsed.models, normalizedCities)
          : sanitizeModelsList(def.models, normalizedCities);
        const normalizedState = {
          bl: Array.isArray(parsed.bl) ? parsed.bl : def.bl,
          models: sanitizedModels,
          modelCities: normalizedCities,
          team: Array.isArray(parsed.team) ? parsed.team : def.team,
          rules: Array.isArray(parsed.rules) ? parsed.rules : def.rules,
          fines: Array.isArray(parsed.fines) ? parsed.fines : def.fines,
          paymentMethods: Array.isArray(parsed.paymentMethods) && parsed.paymentMethods.length > 0
            ? parsed.paymentMethods
            : JSON.parse(JSON.stringify(def.paymentMethods)),
          oneTimeCodes: Array.isArray(parsed.oneTimeCodes) && parsed.oneTimeCodes.length > 0
            ? parsed.oneTimeCodes
            : JSON.parse(JSON.stringify(def.oneTimeCodes)),
          acc: Array.isArray(parsed.acc) ? parsed.acc : [],
          shifts: Array.isArray(parsed.shifts) ? parsed.shifts : [],
          closings: Array.isArray(parsed.closings) ? parsed.closings : [],
          weeklyReports: Array.isArray(parsed.weeklyReports) ? parsed.weeklyReports : []
        };
        localStorage.setItem(STORE_KEY, JSON.stringify(normalizedState));
        return normalizedState;
      } catch (e) {
        const fallback = JSON.parse(JSON.stringify(def));
        fallback.modelCities = [...BASE_MODEL_CITIES];
        fallback.models = sanitizeModelsList(fallback.models, fallback.modelCities);
        fallback.closings = [];
        fallback.weeklyReports = [];
        return fallback;
      }
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    let toastTimer = null;
    function showToast(message) {
      const el = document.getElementById("toast");
      if (!el) return;
      el.textContent = String(message || "");
      el.classList.add("show");
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.classList.remove("show");
      }, 2200);
    }

    function copyText(text) {
      const value = String(text ?? "");
      if (!value) {
        showToast("Нечего копировать");
        return;
      }
      if (navigator.clipboard && typeof navigator.clipboard.writeText === "function") {
        navigator.clipboard.writeText(value).then(() => {
          showToast("Скопировано");
        }).catch(() => {
          fallbackCopyText(value);
        });
      } else {
        fallbackCopyText(value);
      }
    }

    function fallbackCopyText(value) {
      try {
        const ta = document.createElement("textarea");
        ta.value = value;
        ta.style.position = "fixed";
        ta.style.opacity = "0";
        document.body.appendChild(ta);
        ta.focus();
        ta.select();
        document.execCommand("copy");
        document.body.removeChild(ta);
        showToast("Скопировано");
      } catch (e) {
        showToast("Ошибка копирования");
      }
    }

    function saveState() {
      try {
        const lightState = {
          ...state,
          models: Array.isArray(state.models)
            ? state.models.map((m) => ({
                ...m,
                videos: Array.isArray(m.videos)
                  ? m.videos.filter((v) => v && typeof v.src === "string" && !v.src.startsWith("blob:"))
                  : [],
                routeVideos: Array.isArray(m.routeVideos)
                  ? m.routeVideos.filter((v) => v && typeof v.src === "string" && !v.src.startsWith("blob:"))
                  : []
              }))
            : []
        };
        localStorage.setItem(STORE_KEY, JSON.stringify(lightState));
      } catch (e) {
        showToast("Не удалось сохранить данные (возможно, превышен лимит памяти для медиа)");
      }
      if (!isApplyingRemoteSnapshot) {
        void pushStateToCloud(state);
      }
    }

    async function pushStateToCloud(snapshotState) {
      if (!db || !currentUser || !sharedDocRef || isApplyingRemoteSnapshot) return;
      try {
        await setDoc(sharedDocRef, {
          dataJson: JSON.stringify(snapshotState),
          updatedAt: Date.now(),
          updatedBy: currentUser.uid || "member"
        });
        setSyncStatus("Синхронизация: общая база онлайн");
      } catch (err) {
        console.error("Shared sync write failed:", err);
        setSyncStatus("Синхронизация: ошибка отправки (сохранено локально)");
      }
    }

    async function initSharedGroupSync() {
      if (!hasFirebaseConfig) {
        setSyncStatus("Синхронизация: локальный режим");
        return;
      }

      try {
        const firebaseConfig = typeof rawFirebaseConfig === "string"
          ? JSON.parse(rawFirebaseConfig)
          : rawFirebaseConfig;

        const app = initializeApp(firebaseConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        setSyncStatus("Синхронизация: вход...");
        if (initialAuthToken) {
          await signInWithCustomToken(auth, initialAuthToken);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) {
          setSyncStatus("Синхронизация: нет доступа");
          return;
        }

        sharedDocRef = doc(db, "artifacts", appId, "public", "data", "tabu_group_state", "main");

        const existingSnap = await getDoc(sharedDocRef);
        if (!existingSnap.exists()) {
          await pushStateToCloud(state);
        }

        onSnapshot(
          sharedDocRef,
          (docSnap) => {
            if (!docSnap.exists()) return;
            const rawDoc = docSnap.data();
            let parsedRemote = null;
            try {
              if (typeof rawDoc.dataJson === "string" && rawDoc.dataJson.trim()) {
                parsedRemote = JSON.parse(rawDoc.dataJson);
              } else if (rawDoc.state && typeof rawDoc.state === "object") {
                parsedRemote = rawDoc.state;
              }
            } catch (parseErr) {
              console.error("Failed to parse remote state:", parseErr);
              return;
            }

            if (!parsedRemote) return;

            const normalizedRemote = {
              bl: Array.isArray(parsedRemote.bl) ? parsedRemote.bl : def.bl,
              models: sanitizeModelsList(
                Array.isArray(parsedRemote.models) ? parsedRemote.models : def.models,
                Array.isArray(parsedRemote.modelCities) && parsedRemote.modelCities.length > 0
                  ? parsedRemote.modelCities
                  : BASE_MODEL_CITIES
              ),
              modelCities: Array.isArray(parsedRemote.modelCities) && parsedRemote.modelCities.length > 0
                ? parsedRemote.modelCities
                : [...BASE_MODEL_CITIES],
              team: Array.isArray(parsedRemote.team) ? parsedRemote.team : def.team,
              rules: Array.isArray(parsedRemote.rules) ? parsedRemote.rules : def.rules,
              fines: Array.isArray(parsedRemote.fines) ? parsedRemote.fines : def.fines,
              paymentMethods: Array.isArray(parsedRemote.paymentMethods) && parsedRemote.paymentMethods.length > 0
                ? parsedRemote.paymentMethods
                : JSON.parse(JSON.stringify(def.paymentMethods)),
              oneTimeCodes: Array.isArray(parsedRemote.oneTimeCodes) && parsedRemote.oneTimeCodes.length > 0
                ? parsedRemote.oneTimeCodes
                : JSON.parse(JSON.stringify(def.oneTimeCodes)),
              acc: Array.isArray(parsedRemote.acc) ? parsedRemote.acc : [],
              shifts: Array.isArray(parsedRemote.shifts) ? parsedRemote.shifts : [],
              closings: Array.isArray(parsedRemote.closings) ? parsedRemote.closings : [],
              weeklyReports: Array.isArray(parsedRemote.weeklyReports) ? parsedRemote.weeklyReports : []
            };

            const remoteSerialized = JSON.stringify(normalizedRemote);
            const currentSerialized = JSON.stringify(state);

            if (remoteSerialized !== currentSerialized) {
              isApplyingRemoteSnapshot = true;
              try {
                state = normalizedRemote;
                try {
                  localStorage.setItem(STORE_KEY, remoteSerialized);
                } catch (lsErr) {}
                renderMain();
              } finally {
                isApplyingRemoteSnapshot = false;
              }
            }
            setSyncStatus("Синхронизация: общая база онлайн");
          },
          (snapErr) => {
            console.error("Shared snapshot error:", snapErr);
            setSyncStatus("Синхронизация: переподключение...");
          }
        );
      } catch (initErr) {
        console.error("Shared sync init error:", initErr);
        setSyncStatus("Синхронизация: офлайн / локально");
      }
    }

    function formatTodayDotDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, "0");
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const yyyy = String(now.getFullYear());
      return `${dd}.${mm}.${yyyy}`;
    }

    function parseNumericPrice(val) {
      const cleaned = String(val ?? "").replace(/\s+/g, "").replace(",", ".");
      const match = cleaned.match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) || 0 : 0;
    }

    function formatAccountingEntryText(entry) {
      const lines = [
        entry.date || "",
        `Модель: ${entry.model || ""}`,
        `Продолжительность: ${entry.duration || ""}`,
        `Прайс: ${entry.price || ""}`,
        `Оператор: ${entry.operator || ""}`,
        `Время: ${entry.time || ""}`,
        `Номер клиента: ${entry.clientPhone || ""}`,
        `Отзыв: ${entry.review || ""}`,
        `Адрес: ${entry.address || ""}`
      ];
      return lines.join("\n").trim();
    }

    function buildShiftReportText(report) {
      const orders = Array.isArray(report.orders) ? report.orders : [];
      const orderBlocks = orders.map((ord) => [
        `Модель:${ord.model || ""}`,
        `Продолжительность:${ord.duration || ""}`,
        `Прайс: ${ord.price || ""}`
      ].join("\n")).join("\n\n");

      const parts = [
        report.date || "",
        `Кол-во соо: ${report.messagesCount || ""}`,
        `Заказы-${report.ordersCount || orders.length || 0}`
      ];
      if (orderBlocks) parts.push(orderBlocks);
      parts.push(`Оператор:${report.operator || ""}`);
      parts.push(`Тотал ${report.total || ""}`.trim());
      return parts.join("\n\n").trim();
    }

    function buildDailyClosingText(closing) {
      const slashLeft = String(closing.slashLeft ?? "").trim();
      const slashRight = String(closing.slashRight ?? "").trim();
      const slashLine = `${slashLeft}/${slashRight}`;
      return [
        closing.date || formatTodayDotDate(),
        `ТОТАЛ ДНЯ: ${closing.totalDay ?? ""}`.trim(),
        slashLine
      ].join("\n");
    }

    function buildWeeklyReportText(weekly) {
      return [
        "ВЫПЛАЧЕНО",
        "🥩🥩🥩🥩🥩🥩🥩🥩🥩",
        `ТОТАЛ НЕДЕЛИ ГРУЗИЯ/АРМЕНИЯ/ДУБАЙ : ${weekly.totalWeek ?? ""}`.trim()
      ].join("\n\n");

          </div>
          <div class="form-group">
            <label class="form-label">Кол-во соо</label>
            <input class="form-control" name="messagesCount" type="text" placeholder="Количество сообщений" />
          </div>
          <div class="form-group">
            <label class="form-label">Заказы (кол-во)</label>
            <input class="form-control" id="shiftOrdersCountInput" name="ordersCount" type="text" value="2" />
          </div>
          <div id="shiftOrdersContainer"></div>
          <div class="form-group">
            <button type="button" class="btn-secondary" id="addShiftOrderBlockBtn" style="width:100%;">+ Добавить заказ</button>
          </div>
          <div class="form-group">
            <label class="form-label">Оператор</label>
            <input class="form-control" name="operator" type="text" placeholder="Имя оператора" />
          </div>
          <div class="form-group">
            <label class="form-label">Тотал</label>
            <input class="form-control" name="total" type="text" placeholder="Итоговая сумма" />
          </div>
          <button type="submit" class="btn-primary" style="width:100%;">Сохранить отчёт</button>
        </form>
      `);

      const ordersContainer = document.getElementById("shiftOrdersContainer");
      const ordersCountInput = document.getElementById("shiftOrdersCountInput");
      let orderBlocksCount = 2;

      const renderOrderBlocks = () => {
        const existingValues = Array.from(ordersContainer.querySelectorAll(".shift-order-block")).map((block) => ({
          model: block.querySelector(".ord-model")?.value || "",
          duration: block.querySelector(".ord-duration")?.value || "",
          price: block.querySelector(".ord-price")?.value || ""
        }));

        ordersContainer.innerHTML = Array.from({ length: orderBlocksCount }, (_, idx) => {
          const prev = existingValues[idx] || { model: "", duration: "", price: "" };
          return `
            <div class="detail-block shift-order-block">
              <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:8px;">
                <div class="detail-label" style="margin:0;">Заказ #${idx + 1}</div>
                ${orderBlocksCount > 1 ? `<button type="button" class="mini-btn danger remove-order-block-btn" data-idx="${idx}">✕</button>` : ""}
              </div>
              <div class="form-group" style="margin-bottom:8px;">
                <label class="form-label">Модель</label>
                <input class="form-control ord-model" type="text" value="${escapeHtml(prev.model)}" placeholder="Например: Оксана" />
              </div>
              <div class="form-group" style="margin-bottom:8px;">
                <label class="form-label">Продолжительность</label>
                <input class="form-control ord-duration" type="text" value="${escapeHtml(prev.duration)}" placeholder="Например: 1ч" />
              </div>
              <div class="form-group" style="margin-bottom:0;">
                <label class="form-label">Прайс</label>
                <input class="form-control ord-price" type="text" value="${escapeHtml(prev.price)}" placeholder="Например: 700 GEL" />
              </div>
            </div>
          `;
        }).join("");

        if (ordersCountInput) {
          ordersCountInput.value = String(orderBlocksCount);
        }

        ordersContainer.querySelectorAll(".remove-order-block-btn").forEach((btn) => {
          btn.addEventListener("click", () => {
            const removeIdx = Number(btn.dataset.idx);
            const currentVals = Array.from(ordersContainer.querySelectorAll(".shift-order-block")).map((block) => ({
              model: block.querySelector(".ord-model")?.value || "",
              duration: block.querySelector(".ord-duration")?.value || "",
              price: block.querySelector(".ord-price")?.value || ""
            }));
            currentVals.splice(removeIdx, 1);
            orderBlocksCount = Math.max(1, orderBlocksCount - 1);
            renderOrderBlocks();
            ordersContainer.querySelectorAll(".shift-order-block").forEach((block, i) => {
              if (currentVals[i]) {
                block.querySelector(".ord-model").value = currentVals[i].model;
                block.querySelector(".ord-duration").value = currentVals[i].duration;
                block.querySelector(".ord-price").value = currentVals[i].price;
              }
            });
          });
        });
      };

      renderOrderBlocks();

      document.getElementById("addShiftOrderBlockBtn").addEventListener("click", () => {
        orderBlocksCount += 1;
        renderOrderBlocks();
      });

      document.getElementById("addShiftReportForm").addEventListener("submit", (e) => {
        e.preventDefault();
        const fd = new FormData(e.target);
        const orders = Array.from(ordersContainer.querySelectorAll(".shift-order-block")).map((block) => ({
          model: String(block.querySelector(".ord-model")?.value || "").trim(),
          duration: String(block.querySelector(".ord-duration")?.value || "").trim(),
          price: String(block.querySelector(".ord-price")?.value || "").trim()
        }));

        if (!Array.isArray(state.shifts)) state.shifts = [];
        const newId = "sh_" + Date.now();
        const rawOrdersCount = String(fd.get("ordersCount") || "").trim();
        state.shifts.unshift({
          id: newId,
          date: String(fd.get("date") || "").trim(),
          messagesCount: String(fd.get("messagesCount") || "").trim(),
          ordersCount: rawOrdersCount || String(orders.length),
          orders,
          operator: String(fd.get("operator") || "").trim(),
          total: String(fd.get("total") || "").trim()
        });
        selectedShiftIds.add(newId);
        saveState();
        closeSheet();
        if (typeof onSaved === "function") onSaved();
        showToast("Отчёт смены сохранён");
      });
    }

    function openWeeklyReportSheet(onSaved) {
      const allShifts = Array.isArray(state.shifts) ? state.shifts : [];
      const chosenShifts = selectedShiftIds.size > 0
        ? allShifts.filter((s) => selectedShiftIds.has(s.id))
        : allShifts;
      const sumFromShifts = chosenShifts.reduce((accSum, s) => accSum + parseNumericPrice(s.total), 0);

      openSheet(`
        <div class="sheet-header">
          <div class="sheet-title">Недельный отчёт (ВЫПЛАЧЕНО)</div>
          <button class="icon-btn" id="closeSheetBtn" aria-label="Закрыть">✕</button>
        </div>
        <form id="weeklyReportForm">
          <div class="form-group">
            <label class="form-label">ТОТАЛ НЕДЕЛИ ГРУЗИЯ/АРМЕНИЯ/ДУБАЙ : (сумма по отчётам: ${sumFromShifts})</label>
            <input class="form-control" name="totalWeek" type="text" value="${sumFromShifts > 0 ? String(sumFromShifts) : ""}" placeholder="Введите сумму недели" />
          </div>
          <div class="detail-block">
            <div class="detail-label">Предпросмотр</div>
            <div class="detail-value" id="weeklyPreviewText">${escapeHtml(buildWeeklyReportText({ totalWeek: sumFromShifts > 0 ? String(sumFromShifts) : "" }))}</div>
          </div>
          <div class="quick-actions-grid" style="margin-bottom:0;">
            <button type="button" class="btn-secondary" id="copyWeeklyPreviewBtn">📋 Копировать</button>
            <button type="submit" class="btn-primary">Сохранить отчёт</button>
          </div>
        </form>
      `);

      const form = document.getElementById("weeklyReportForm");
      const totalWeekInput = form.querySelector('input[name="totalWeek"]');
      const previewEl = document.getElementById("weeklyPreviewText");

      const updatePreview = () => {
        if (previewEl) {
          previewEl.textContent = buildWeeklyReportText({ totalWeek: totalWeekInput.value.trim() });
        }
      };

      totalWeekInput.addEventListener("input", updatePreview);

      document.getElementById("copyWeeklyPreviewBtn").addEventListener("click", () => {
        copyText(buildWeeklyReportText({ totalWeek: totalWeekInput.value.trim() }));
      });

      form.addEventListener("submit", (e) => {
        e.preventDefault();
        if (!Array.isArray(state.weeklyReports)) state.weeklyReports = [];
        state.weeklyReports.unshift({
          id: "wk_" + Date.now(),
          createdAt: formatTodayDotDate(),
          totalWeek: totalWeekInput.value.trim(),
          count: Array.isArray(state.shifts) ? state.shifts.length : 0
        });
        saveState();
        closeSheet();
        if (typeof onSaved === "function") onSaved();
        showToast("Недельный отчёт сохранён");
      });
    }

    function renderAccountingSubTab(container) {
      const entries = Array.isArray(state.acc) ? state.acc : [];
      const closings = Array.isArray(state.closings) ? state.closings : [];
      const totalSum = entries.reduce((s, item) => s + parseNumericPrice(item.price), 0);
      const selectedSum = entries
        .filter((item) => selectedAccIds.has(item.id))
        .reduce((s, item) => s + parseNumericPrice(item.price), 0);
      const allSelected = entries.length > 0 && entries.every((item) => selectedAccIds.has(item.id));

      // `entries` is ordered newest-first (index 0 is newest, entries.length - 1 is oldest).
      // Each closing stores `count` = how many entries existed when that closing was made.
      // Placing each closing right below the entries added after it and above the older entries
      // that existed before it keeps: [newest entries] -> [latest closing] -> [earlier entries] -> [older closing]...
      const chronologicalClosings = [...closings].reverse();
      const feedItems = [];
      let entryCursor = 0;

      for (let i = chronologicalClosings.length - 1; i >= 0; i -= 1) {
        const cl = chronologicalClosings[i];
        const snapshotCount = Math.max(0, Math.min(entries.length, Number(cl.count ?? entries.length)));
        const newerEntriesCount = Math.max(0, entries.length - snapshotCount);

        while (entryCursor < newerEntriesCount && entryCursor < entries.length) {
          feedItems.push({ kind: "entry", item: entries[entryCursor] });
          entryCursor += 1;
        }
        feedItems.push({ kind: "closing", item: cl });
      }

      while (entryCursor < entries.length) {
        feedItems.push({ kind: "entry", item: entries[entryCursor] });
        entryCursor += 1;
      }

      container.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Записей в кассе</div>
            <div class="stat-val">${entries.length}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Выбрано / Всего</div>
            <div class="stat-val">${selectedAccIds.size > 0 ? selectedSum : totalSum}</div>
          </div>
        </div>

        <div class="card-actions" style="margin-bottom:12px; flex-wrap:wrap;">
          <button type="button" class="btn-primary" id="openAddAccBtn" style="flex:1;">+ Запись</button>
          <button type="button" class="btn-secondary" id="selectAllAccBtn">${allSelected ? "Снять все" : "Выделить все"}</button>
          <button type="button" class="btn-primary" id="calcCloseCashBtn">Рассчитать</button>
        </div>

        ${feedItems.length === 0 ? `
          <div class="empty-state" style="margin-bottom:14px;">
            <div class="empty-state-title">Записей бухгалтерии пока нет</div>
            <div class="empty-state-sub">Нажмите «+ Запись», чтобы добавить первую встречу.</div>
          </div>
        ` : `
          <div class="card-list" style="margin-bottom:16px;">
            ${feedItems.map((node) => {
              if (node.kind === "closing") {
                const cl = node.item;
                return `
                  <div class="card">
                    <div class="card-top">
                      <div class="card-sub" style="margin:0; white-space:pre-line; color:var(--text); font-weight:600;">${escapeHtml(buildDailyClosingText(cl))}</div>
                      <div class="card-actions">
                        <button type="button" class="mini-btn copy-closing-btn" data-id="${escapeHtml(cl.id)}">Копировать</button>
                        <button type="button" class="mini-btn danger del-closing-btn" data-id="${escapeHtml(cl.id)}">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }

              const item = node.item;
              const isChecked = selectedAccIds.has(item.id);
              return `
                <div class="card">
                  <div class="card-top">
                    <label style="display:flex; align-items:flex-start; gap:10px; flex:1; cursor:pointer;">
                      <input type="checkbox" class="acc-select-cb" data-id="${escapeHtml(item.id)}" ${isChecked ? "checked" : ""} style="margin-top:4px; width:17px; height:17px;" />
                      <div>
                        <div class="card-title">${escapeHtml(item.model || "Без модели")}${item.date ? ` · ${escapeHtml(item.date)}` : ""}</div>
                        <div class="card-sub">${escapeHtml(formatAccountingEntryText(item))}</div>
                      </div>
                    </label>
                    <div class="card-actions">
                      <button type="button" class="mini-btn copy-acc-btn" data-id="${escapeHtml(item.id)}">Копировать</button>
                      <button type="button" class="mini-btn danger del-acc-btn" data-id="${escapeHtml(item.id)}">✕</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `}
      `;

      document.getElementById("openAddAccBtn").addEventListener("click", () => {
        openAddAccountingSheet(() => renderAccountingSubTab(container));
      });

      document.getElementById("selectAllAccBtn").addEventListener("click", () => {
        if (allSelected) {
          selectedAccIds.clear();
        } else {
          selectedAccIds = new Set(entries.map((item) => item.id));
        }
        renderAccountingSubTab(container);
      });

      document.getElementById("calcCloseCashBtn").addEventListener("click", () => {
        openCloseCashSheet(() => renderAccountingSubTab(container));
      });

      container.querySelectorAll(".acc-select-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) {
            selectedAccIds.add(cb.dataset.id);
          } else {
            selectedAccIds.delete(cb.dataset.id);
          }
          renderAccountingSubTab(container);
        });
      });

      container.querySelectorAll(".copy-acc-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = entries.find((x) => x.id === btn.dataset.id);
          if (item) copyText(formatAccountingEntryText(item));
        });
      });

      container.querySelectorAll(".del-acc-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedAccIds.delete(btn.dataset.id);
          state.acc = entries.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderAccountingSubTab(container);
          showToast("Запись удалена");
        });
      });

      container.querySelectorAll(".copy-closing-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const cl = closings.find((x) => x.id === btn.dataset.id);
          if (cl) copyText(buildDailyClosingText(cl));
        });
      });

      container.querySelectorAll(".del-closing-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.closings = closings.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderAccountingSubTab(container);
          showToast("Закрытие удалено");
        });
      });
    }

    function renderShiftsSubTab(container) {
      const shifts = Array.isArray(state.shifts) ? state.shifts : [];
      const weeklyReports = Array.isArray(state.weeklyReports) ? state.weeklyReports : [];
      const allSelected = shifts.length > 0 && shifts.every((s) => selectedShiftIds.has(s.id));

      // `shifts` is ordered newest-first (index 0 is newest, shifts.length - 1 is oldest).
      // Each weekly report stores `count` = how many shift reports existed when that weekly report was created.
      // Placing each weekly report below newer shift reports added after it and above older shift reports
      // creates the repeating cycle: [new shifts] -> [latest weekly report] -> [earlier shifts] -> [older weekly report].
      const chronologicalWeekly = [...weeklyReports].reverse();
      const feedItems = [];
      let shiftCursor = 0;

      for (let i = chronologicalWeekly.length - 1; i >= 0; i -= 1) {
        const wk = chronologicalWeekly[i];
        const snapshotCount = Math.max(0, Math.min(shifts.length, Number(wk.count ?? shifts.length)));
        const newerShiftsCount = Math.max(0, shifts.length - snapshotCount);

        while (shiftCursor < newerShiftsCount && shiftCursor < shifts.length) {
          feedItems.push({ kind: "shift", item: shifts[shiftCursor] });
          shiftCursor += 1;
        }
        feedItems.push({ kind: "weekly", item: wk });
      }

      while (shiftCursor < shifts.length) {
        feedItems.push({ kind: "shift", item: shifts[shiftCursor] });
        shiftCursor += 1;
      }

      container.innerHTML = `
        <div class="card-actions" style="margin-bottom:12px; flex-wrap:wrap;">
          <button type="button" class="btn-primary" id="openAddShiftBtn" style="flex:1;">+ Отчёт смены</button>
          <button type="button" class="btn-secondary" id="selectAllShiftsBtn">${allSelected ? "Снять все" : "Выделить все"}</button>
          <button type="button" class="btn-primary" id="calcWeeklyBtn">Рассчитать неделю</button>
        </div>

        ${feedItems.length === 0 ? `
          <div class="empty-state" style="margin-bottom:14px;">
            <div class="empty-state-title">Отчётов смен пока нет</div>
            <div class="empty-state-sub">Нажмите «+ Отчёт смены», чтобы сформировать отчёт по смене.</div>
          </div>
        ` : `
          <div class="card-list" style="margin-bottom:16px;">
            ${feedItems.map((node) => {
              if (node.kind === "weekly") {
                const wk = node.item;
                return `
                  <div class="card">
                    <div class="card-top">
                      <div class="card-sub" style="margin:0; white-space:pre-line; color:var(--text); font-weight:600;">${escapeHtml(buildWeeklyReportText(wk))}</div>
                      <div class="card-actions">
                        <button type="button" class="mini-btn copy-weekly-btn" data-id="${escapeHtml(wk.id)}">Копировать</button>
                        <button type="button" class="mini-btn danger del-weekly-btn" data-id="${escapeHtml(wk.id)}">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }

              const rep = node.item;
              const isChecked = selectedShiftIds.has(rep.id);
              return `
                <div class="card">
                  <div class="card-top">
                    <label style="display:flex; align-items:flex-start; gap:10px; flex:1; cursor:pointer;">
                      <input type="checkbox" class="shift-select-cb" data-id="${escapeHtml(rep.id)}" ${isChecked ? "checked" : ""} style="margin-top:4px; width:17px; height:17px;" />
                      <div>
                        <div class="card-title">${escapeHtml(rep.date || "Отчёт")}${rep.operator ? ` · ${escapeHtml(rep.operator)}` : ""}</div>
                        <div class="card-sub" style="white-space:pre-line;">${escapeHtml(buildShiftReportText(rep))}</div>
                      </div>
                    </label>
                    <div class="card-actions">
                      <button type="button" class="mini-btn copy-shift-btn" data-id="${escapeHtml(rep.id)}">Копировать</button>
                      <button type="button" class="mini-btn danger del-shift-btn" data-id="${escapeHtml(rep.id)}">✕</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `}
      `;

      document.getElementById("openAddShiftBtn").addEventListener("click", () => {
        openAddShiftReportSheet(() => renderShiftsSubTab(container));
      });

      document.getElementById("selectAllShiftsBtn").addEventListener("click", () => {
        if (allSelected) {
          selectedShiftIds.clear();
        } else {
          selectedShiftIds = new Set(shifts.map((s) => s.id));
        }
        renderShiftsSubTab(container);
      });

      document.getElementById("calcWeeklyBtn").addEventListener("click", () => {
        openWeeklyReportSheet(() => renderShiftsSubTab(container));
      });

      container.querySelectorAll(".shift-select-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) {
            selectedShiftIds.add(cb.dataset.id);
          } else {
            selectedShiftIds.delete(cb.dataset.id);
          }
          renderShiftsSubTab(container);
        });
      });

      container.querySelectorAll(".copy-shift-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const rep = shifts.find((x) => x.id === btn.dataset.id);
          if (rep) copyText(buildShiftReportText(rep));
        });
      });

      container.querySelectorAll(".del-shift-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedShiftIds.delete(btn.dataset.id);
          state.shifts = shifts.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderShiftsSubTab(container);
          showToast("Отчёт смены удалён");
        });
      });

      container.querySelectorAll(".copy-weekly-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const wk = weeklyReports.find((x) => x.id === btn.dataset.id);
          if (wk) copyText(buildWeeklyReportText(wk));
        });
      });

      container.querySelectorAll(".del-weekly-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.weeklyReports = weeklyReports.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderShiftsSubTab(container);
          showToast("Недельный отчёт удалён");
        });
      });
    }

    function renderOpsTab(container) {
      container.innerHTML = `
        <div class="section-header">
          <div class="section-title">Касса и отчёты</div>
        </div>
        <div class="segmented">
          <button type="button" class="seg-btn ${opsSubTab === "acc" ? "active" : ""}" data-opssub="acc">Бухгалтерия</button>
          <button type="button" class="seg-btn ${opsSubTab === "shifts" ? "active" : ""}" data-opssub="shifts">Отчёты смен</button>
        </div>
        <div id="opsSubContent"></div>
      `;

      container.querySelectorAll("[data-opssub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          opsSubTab = btn.dataset.opssub || "acc";
          renderOpsTab(container);
        });
      });

      const subContent = document.getElementById("opsSubContent");
      if (!subContent) return;

      if (opsSubTab === "shifts") {
        renderShiftsSubTab(subContent);
      } else {
        renderAccountingSubTab(subContent);
      }
    }

    function renderMain() {
      const mainView = document.getElementById("mainView");
      if (!mainView) return;

      document.querySelectorAll("#bottomNav .nav-item").forEach((navBtn) => {
        navBtn.classList.toggle("active", navBtn.dataset.tab === activeTab);
      });

      if (activeTab === "bl") {
        renderBlacklistTab(mainView);
      } else if (activeTab === "models") {
        renderModelsTab(mainView);
      } else if (activeTab === "team") {
        renderTeamTab(mainView);
      } else if (activeTab === "info") {
        renderInfoTab(mainView);
      } else if (activeTab === "ops") {
        renderOpsTab(mainView);
      }
    }

    function initApp() {
      document.querySelectorAll("#bottomNav .nav-item").forEach((navBtn) => {
        navBtn.addEventListener("click", () => {
          activeTab = navBtn.dataset.tab || "bl";
          renderMain();
        });
      });

      const sideEdgeBtn = document.getElementById("sidePaymentEdgeBtn");
      if (sideEdgeBtn) {
        sideEdgeBtn.addEventListener("click", () => openSidePaymentDrawer(false));
      }

      const sideOtcBtn = document.getElementById("sideOtcEdgeBtn");
      if (sideOtcBtn) {
        sideOtcBtn.addEventListener("click", () => openSideOtcDrawer(false));
      }

      const sideDrawer = document.getElementById("sidePaymentDrawer");
      if (sideDrawer) {
        sideDrawer.addEventListener("click", (e) => {
          if (e.target === sideDrawer) {
            closeSidePaymentDrawer();
          }
        });
      }

      const sideOtcDrawer = document.getElementById("sideOtcDrawer");
      if (sideOtcDrawer) {
        sideOtcDrawer.addEventListener("click", (e) => {
          if (e.target === sideOtcDrawer) {
            closeSideOtcDrawer();
          }
        });
      }

      const backdrop = document.getElementById("sheetBackdrop");
      if (backdrop) {
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) {
            closeSheet();
          }
        });
      }

      renderMain();
      void initSharedGroupSync();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
