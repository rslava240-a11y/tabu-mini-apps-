            if (!phone) return;

            if (!Array.isArray(state.bl)) state.bl = [];
            state.bl.unshift({
              id: "bl_" + Date.now(),
              phone,
              reason
            });
            saveState();
            closeSheet();
            renderBlacklistTab(container);
            showToast("Номер добавлен в ЧС");
          });
        });
      }

      const input = document.getElementById("blSearchInput");
      if (input) {
        input.addEventListener("input", (e) => {
          searchQuery = e.target.value;
          renderBlacklistTab(container);
          const nextInput = document.getElementById("blSearchInput");
          if (nextInput) {
            nextInput.focus();
            nextInput.setSelectionRange(nextInput.value.length, nextInput.value.length);
          }
        });
      }

      const clearBtn = document.getElementById("clearBlSearch");
      if (clearBtn) {
        clearBtn.addEventListener("click", () => {
          searchQuery = "";
          renderBlacklistTab(container);
        });
      }

      container.querySelectorAll(".copy-bl-btn").forEach((btn) => {
        btn.addEventListener("click", () => copyText(btn.dataset.phone || ""));
      });

      container.querySelectorAll(".del-bl-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.bl = (state.bl || []).filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderBlacklistTab(container);
          showToast("Номер удалён из ЧС");
        });
      });
    }

    function renderModelsTab(container) {
      const cities = getAllowedModelCities();
      const allModels = Array.isArray(state.models) ? state.models : [];
      const filtered = modelCityFilter === "Все"
        ? allModels
        : allModels.filter((m) => String(m.city || "").toLowerCase() === modelCityFilter.toLowerCase());

      container.innerHTML = `
        <div class="section-header">
          <div class="section-title">Модели</div>
          <div class="card-actions">
            <button type="button" class="btn-secondary" id="addCityBtn">+ Город</button>
            <button type="button" class="btn-primary" id="addModelBtn">+ Модель</button>
          </div>
        </div>
        <div class="chips-row">
          <button type="button" class="chip ${modelCityFilter === "Все" ? "active" : ""}" data-city="Все">Все</button>
          ${cities.map((c) => `
            <button type="button" class="chip ${modelCityFilter.toLowerCase() === c.toLowerCase() ? "active" : ""}" data-city="${escapeHtml(c)}">${escapeHtml(c)}</button>
          `).join("")}
        </div>
        ${filtered.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-title">Нет моделей в выбранном фильтре</div>
            <div class="empty-state-sub">Переключите город, добавьте новый город или анкету модели.</div>
          </div>
        ` : `
          <div class="card-list">
            ${filtered.map((m) => {
              const photos = Array.isArray(m.photos) ? m.photos : [];
              const routePhotos = Array.isArray(m.routePhotos) ? m.routePhotos : [];
              const videos = Array.isArray(m.videos) ? m.videos : [];
              const routeVideos = Array.isArray(m.routeVideos) ? m.routeVideos : [];
              const coverPhoto = photos.length > 0 ? getPhotoDisplaySrc(photos[0]) : "";
              return `
                <div class="card clickable open-model-card" data-id="${escapeHtml(m.id)}">
                  <div class="model-card-header-row">
                    ${coverPhoto ? `<img class="model-card-cover" src="${escapeHtml(coverPhoto)}" alt="${escapeHtml(m.name || "")}" onerror="this.style.display='none'" />` : ""}
                    <div style="flex:1; min-width:0;">
                      <div class="card-top">
                        <div>
                          <div class="card-title">${escapeHtml(m.name || "")}</div>
                          <div class="card-sub">${escapeHtml(m.meta || "")}</div>
                        </div>
                        <div class="card-actions">
                          <button type="button" class="mini-btn edit-model-btn" data-id="${escapeHtml(m.id)}">✎</button>
                          <button type="button" class="mini-btn ${m.active !== false ? "status-on" : "status-off"} toggle-model-btn" data-id="${escapeHtml(m.id)}">
                            ${m.active !== false ? "На смене" : "Выходной"}
                          </button>
                          <button type="button" class="mini-btn danger del-model-btn" data-id="${escapeHtml(m.id)}">✕</button>
                        </div>
                      </div>
                      <div class="card-meta">
                        <span class="pill">${escapeHtml(m.city || "")}</span>
                        ${m.incall ? `<span class="pill">${escapeHtml(m.incall)}</span>` : ""}
                        ${photos.length > 0 ? `<span class="pill">Фото: ${photos.length}</span>` : ""}
                        ${videos.length > 0 ? `<span class="pill">Видео: ${videos.length}</span>` : ""}
                        ${routePhotos.length > 0 ? `<span class="pill">Проходка фото: ${routePhotos.length}</span>` : ""}
                        ${routeVideos.length > 0 ? `<span class="pill">Проходка видео: ${routeVideos.length}</span>` : ""}
                      </div>
                    </div>
                  </div>
                  ${m.address ? `<div class="card-sub" style="margin-top:8px;">${escapeHtml(m.address)}</div>` : ""}
                  <div class="model-quick-strip">
                    <button type="button" class="mini-btn copy-model-pitch-btn" data-id="${escapeHtml(m.id)}">📋 Текст клиенту</button>
                    <button type="button" class="mini-btn copy-model-addr-btn" data-id="${escapeHtml(m.id)}">📍 Адрес</button>
                    <button type="button" class="mini-btn copy-model-link-btn" data-id="${escapeHtml(m.id)}">🔗 Ссылка</button>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `}
      `;

      document.getElementById("addModelBtn").addEventListener("click", () => {
        const defaultCity = modelCityFilter !== "Все" ? modelCityFilter : (cities[0] || "Тбилиси");
        openSheet(`
          <div class="sheet-header">
            <div class="sheet-title">Новая анкета модели</div>
            <button class="icon-btn" id="closeSheetBtn" aria-label="Закрыть">✕</button>
          </div>
          <form id="createModelForm">
            <div class="form-group">
              <label class="form-label">Имя модели</label>
              <input class="form-control" name="name" type="text" placeholder="Например: Алина" required />
            </div>
            <div class="form-group">
              <label class="form-label">Город</label>
              <select class="form-control" name="city">
                ${cities.map((c) => `
                  <option value="${escapeHtml(c)}" ${c.toLowerCase() === defaultCity.toLowerCase() ? "selected" : ""}>${escapeHtml(c)}</option>
                `).join("")}
              </select>
            </div>
            <div class="form-group">
              <label class="form-label">Возраст / параметры</label>
              <input class="form-control" name="meta" type="text" placeholder="Например: 20 лет · 168/52" />
            </div>
            <div class="form-group">
              <label class="form-label">Incall / Outcall</label>
              <input class="form-control" name="incall" type="text" placeholder="30м 500 / 1ч 700 GEL" />
            </div>
            <div class="form-group">
              <label class="form-label">Адрес</label>
              <textarea class="form-control" name="address" placeholder="Адрес, этаж, код"></textarea>
            </div>
            <div class="form-group">
              <label class="form-label">Ссылка на карту / адрес</label>
              <input class="form-control" name="mapLink" type="text" placeholder="https://maps.google.com/..." />
            </div>
            <div class="form-group">
              <label class="form-label">Описание для клиента</label>
              <textarea class="form-control" name="description" placeholder="Текст описания для клиента"></textarea>
            </div>
            <div class="form-group">
              <label class="upload-dropzone" for="newModelPhotosInput">+ Загрузить фото модели (<span id="newModelPhotosCount">0</span>)</label>
              <input id="newModelPhotosInput" type="file" accept="image/*" multiple style="display:none;" />
            </div>
            <div class="form-group">
              <label class="upload-dropzone" for="newModelRoutePhotosInput">+ Загрузить фото проходки (<span id="newModelRoutePhotosCount">0</span>)</label>
              <input id="newModelRoutePhotosInput" type="file" accept="image/*" multiple style="display:none;" />
            </div>
            <div class="form-group">
              <label class="upload-dropzone" for="newModelVideosInput">+ Загрузить видео модели (<span id="newModelVideosCount">0</span>)</label>
              <input id="newModelVideosInput" type="file" accept="video/*" multiple style="display:none;" />
            </div>
            <div class="form-group">
              <label class="upload-dropzone" for="newModelRouteVideosInput">+ Загрузить видео проходки (<span id="newModelRouteVideosCount">0</span>)</label>
              <input id="newModelRouteVideosInput" type="file" accept="video/*" multiple style="display:none;" />
            </div>
            <button type="submit" id="submitCreateModelBtn" class="btn-primary" style="width:100%;">Создать анкету</button>
          </form>
        `);

        let pendingPhotos = [];
        let pendingRoutePhotos = [];
        let pendingVideos = [];
        let pendingRouteVideos = [];
        let isProcessingMedia = false;

        const setSubmitBusy = (busy) => {
          isProcessingMedia = busy;
          const submitBtn = document.getElementById("submitCreateModelBtn");
          if (submitBtn) {
            submitBtn.disabled = busy;
            submitBtn.style.opacity = busy ? "0.65" : "1";
            submitBtn.textContent = busy ? "Обработка медиа..." : "Создать анкету";
          }
        };

        document.getElementById("newModelPhotosInput").addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          setSubmitBusy(true);
          showToast("Обработка фото...");
          const added = await compressImageFiles(files, 680, 0.64, "draft_model", "photos");
          e.target.value = "";
          pendingPhotos = [...pendingPhotos, ...added];
          const el = document.getElementById("newModelPhotosCount");
          if (el) el.textContent = String(pendingPhotos.length);
          setSubmitBusy(false);
          showToast(`Выбрано фото: ${pendingPhotos.length}`);
        });

        document.getElementById("newModelRoutePhotosInput").addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          setSubmitBusy(true);
          showToast("Обработка фото проходки...");
          const added = await compressImageFiles(files, 680, 0.64, "draft_model", "routePhotos");
          e.target.value = "";
          pendingRoutePhotos = [...pendingRoutePhotos, ...added];
          const el = document.getElementById("newModelRoutePhotosCount");
          if (el) el.textContent = String(pendingRoutePhotos.length);
          setSubmitBusy(false);
          showToast(`Выбрано фото проходки: ${pendingRoutePhotos.length}`);
        });

        document.getElementById("newModelVideosInput").addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          setSubmitBusy(true);
          showToast("Сохранение видео...");
          const added = await readVideoFiles(files, "draft_model", "videos");
          e.target.value = "";
          pendingVideos = [...pendingVideos, ...added];
          const el = document.getElementById("newModelVideosCount");
          if (el) el.textContent = String(pendingVideos.length);
          setSubmitBusy(false);
          showToast(`Выбрано видео: ${pendingVideos.length}`);
        });

        document.getElementById("newModelRouteVideosInput").addEventListener("change", async (e) => {
          const files = e.target.files;
          if (!files || !files.length) return;
          setSubmitBusy(true);
          showToast("Сохранение видео проходки...");
          const added = await readVideoFiles(files, "draft_model", "routeVideos");
          e.target.value = "";
          pendingRouteVideos = [...pendingRouteVideos, ...added];
          const el = document.getElementById("newModelRouteVideosCount");
          if (el) el.textContent = String(pendingRouteVideos.length);
          setSubmitBusy(false);
          showToast(`Выбрано видео проходки: ${pendingRouteVideos.length}`);
        });

        document.getElementById("createModelForm").addEventListener("submit", async (e) => {
          e.preventDefault();
          if (isProcessingMedia) {
            showToast("Дождитесь завершения обработки медиа");
            return;
          }
          const fd = new FormData(e.target);
          const allowed = getAllowedModelCities();
          const chosenCity = normalizeModelCity(fd.get("city"), allowed) || allowed[0] || "Тбилиси";
          const nextModelId = "m_" + Date.now();

          const rescopedPhotos = await Promise.all(pendingPhotos.map(async (p, idx) => {
            const oldId = p.photoId || "";
            const srcVal = getPhotoDisplaySrc(p);
            const newId = createMediaScopeKey(nextModelId, "photos", `${USER_ADDED_PHOTO_PREFIX}${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`);
            if (srcVal) {
              photoUrlCache.set(newId, srcVal);
              await savePhotoDataToDb(newId, srcVal, p.name || `photo_${idx + 1}.jpg`);
            }
            if (oldId) {
              await deletePhotoFromDb(oldId);
            }
            return { photoId: newId, src: srcVal, name: p.name || `photo_${idx + 1}.jpg` };
          }));

          const rescopedRoutePhotos = await Promise.all(pendingRoutePhotos.map(async (p, idx) => {
            const oldId = p.photoId || "";
            const srcVal = getPhotoDisplaySrc(p);
            const newId = createMediaScopeKey(nextModelId, "routePhotos", `${USER_ADDED_PHOTO_PREFIX}${Date.now()}_${idx}_${Math.random().toString(36).slice(2, 6)}`);
            if (srcVal) {
              photoUrlCache.set(newId, srcVal);
              await savePhotoDataToDb(newId, srcVal, p.name || `route_${idx + 1}.jpg`);
            }
            if (oldId) {
              await deletePhotoFromDb(oldId);
            }
            return { photoId: newId, src: srcVal, name: p.name || `route_${idx + 1}.jpg` };
          }));

          const rescopedVideos = await Promise.all(pendingVideos.map(async (v, idx) => {
            const oldId = v.mediaId || "";
            const newId = createMediaScopeKey(nextModelId, "videos", `${USER_ADDED_VIDEO_PREFIX}${Date.now()}_${idx}`);
            const rec = oldId ? await getVideoRecordFromDb(oldId) : null;
            let nextSrc = (typeof v.src === "string" && !v.src.startsWith("blob:")) ? v.src : "";
            let nextDataUrl = (typeof v.dataUrl === "string" && v.dataUrl.startsWith("data:video/")) ? v.dataUrl : "";
            if (rec && rec.blob instanceof Blob) {
              await saveVideoBlobToDb(newId, rec.blob, rec.name || v.name || "video.mp4", rec.mimeType || rec.blob.type || "video/mp4", rec.dataUrl || nextDataUrl);
              nextSrc = URL.createObjectURL(rec.blob);
              videoUrlCache.set(newId, nextSrc);
              if (!nextDataUrl && rec.dataUrl) nextDataUrl = rec.dataUrl;
            } else if (typeof v.src === "string" && v.src.startsWith("blob:")) {
              nextSrc = v.src;
              videoUrlCache.set(newId, nextSrc);
            }
            if (oldId) {
              await deleteVideoFromDb(oldId);
            }
            return { mediaId: newId, src: nextSrc || nextDataUrl, dataUrl: nextDataUrl, name: v.name || `video_${idx + 1}.mp4` };
          }));

          const rescopedRouteVideos = await Promise.all(pendingRouteVideos.map(async (v, idx) => {
            const oldId = v.mediaId || "";
            const newId = createMediaScopeKey(nextModelId, "routeVideos", `${USER_ADDED_VIDEO_PREFIX}${Date.now()}_${idx}`);
            const rec = oldId ? await getVideoRecordFromDb(oldId) : null;
            let nextSrc = (typeof v.src === "string" && !v.src.startsWith("blob:")) ? v.src : "";
            let nextDataUrl = (typeof v.dataUrl === "string" && v.dataUrl.startsWith("data:video/")) ? v.dataUrl : "";
            if (rec && rec.blob instanceof Blob) {
              await saveVideoBlobToDb(newId, rec.blob, rec.name || v.name || "route_video.mp4", rec.mimeType || rec.blob.type || "video/mp4", rec.dataUrl || nextDataUrl);
              nextSrc = URL.createObjectURL(rec.blob);
              videoUrlCache.set(newId, nextSrc);
              if (!nextDataUrl && rec.dataUrl) nextDataUrl = rec.dataUrl;
            } else if (typeof v.src === "string" && v.src.startsWith("blob:")) {
              nextSrc = v.src;
              videoUrlCache.set(newId, nextSrc);
            }
            if (oldId) {
              await deleteVideoFromDb(oldId);
            }
            return { mediaId: newId, src: nextSrc || nextDataUrl, dataUrl: nextDataUrl, name: v.name || `route_video_${idx + 1}.mp4` };
          }));

          const newModel = {
            id: nextModelId,
            name: String(fd.get("name") || "").trim(),
            city: chosenCity,
            meta: String(fd.get("meta") || "").trim(),
            district: "",
            incall: String(fd.get("incall") || "").trim(),
            outcall: "",
            address: String(fd.get("address") || "").trim(),
            mapLink: String(fd.get("mapLink") || "").trim(),
            description: String(fd.get("description") || "").trim(),
            services: "",
            extras: "",
            phones: "",
            photos: rescopedPhotos,
            routePhotos: rescopedRoutePhotos,
            videos: rescopedVideos,
            routeVideos: rescopedRouteVideos,
            active: true
          };
          if (!Array.isArray(state.models)) state.models = [];
          state.models.unshift(newModel);
          saveState();
          closeSheet();
          renderModelsTab(container);
          showToast(`Анкета создана (фото: ${newModel.photos.length}, видео: ${newModel.videos.length})`);
        });
      });

      document.getElementById("addCityBtn").addEventListener("click", () => {
        openSheet(`
          <div class="sheet-header">
            <div class="sheet-title">Добавить город</div>
            <button class="icon-btn" id="closeSheetBtn" aria-label="Закрыть">✕</button>
          </div>
          <form id="addCityForm">
            <div class="form-group">
              <label class="form-label">Название города</label>
              <input class="form-control" name="cityName" type="text" placeholder="Например: Батуми" required />
            </div>
            <button type="submit" class="btn-primary" style="width:100%;">Добавить</button>
          </form>
        `);
        document.getElementById("addCityForm").addEventListener("submit", (e) => {
          e.preventDefault();
          const fd = new FormData(e.target);
          const clean = normalizeCityName(fd.get("cityName"));
          if (!clean) {
            showToast("Некорректное название");
            return;
          }
          if (!Array.isArray(state.modelCities)) state.modelCities = [...BASE_MODEL_CITIES];
          if (!state.modelCities.some((c) => c.toLowerCase() === clean.toLowerCase())) {
            state.modelCities.push(clean);
            saveState();
          }
          modelCityFilter = clean;
          closeSheet();
          renderModelsTab(container);
          showToast(`Город «${clean}» добавлен`);
        });
      });

      container.querySelectorAll(".chip[data-city]").forEach((chip) => {
        chip.addEventListener("click", () => {
          modelCityFilter = chip.dataset.city || "Все";
          renderModelsTab(container);
        });
      });

      container.querySelectorAll(".open-model-card").forEach((card) => {
        card.addEventListener("click", () => {
          openModelDetailSheet(card.dataset.id);
        });
      });

      container.querySelectorAll(".edit-model-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          openEditModelSheet(btn.dataset.id);
        });
      });

      container.querySelectorAll(".copy-model-pitch-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const target = (state.models || []).find((x) => x.id === btn.dataset.id);
          copyText(buildModelClientText(target));
        });
      });

      container.querySelectorAll(".copy-model-addr-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const target = (state.models || []).find((x) => x.id === btn.dataset.id);
          copyText(target?.address || "");
        });
      });

      container.querySelectorAll(".copy-model-link-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const target = (state.models || []).find((x) => x.id === btn.dataset.id);
          const link = getModelMapUrl(target);
          if (!link) {
            showToast("Ссылка на адрес отсутствует");
            return;
          }
          copyText(link);
        });
      });

      container.querySelectorAll(".toggle-model-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const target = (state.models || []).find((x) => x.id === btn.dataset.id);
          if (target) {
            target.active = !(target.active !== false);
            saveState();
            renderModelsTab(container);
          }
        });
      });

      container.querySelectorAll(".del-model-btn").forEach((btn) => {
        btn.addEventListener("click", (e) => {
          e.stopPropagation();
          const target = (state.models || []).find((x) => x.id === btn.dataset.id);
          if (target) {
            [...(target.photos || []), ...(target.routePhotos || [])].forEach((p) => {
              const norm = normalizePhotoEntry(p, 0);
              if (norm && norm.photoId) void deletePhotoFromDb(norm.photoId);
            });
            [...(target.videos || []), ...(target.routeVideos || [])].forEach((v) => {
              if (v && v.mediaId) void deleteVideoFromDb(v.mediaId);
            });
          }
          state.models = (state.models || []).filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderModelsTab(container);
          showToast("Анкета удалена");
        });
      });
    }

    function renderTeamTab(container) {
      const members = Array.isArray(state.team) ? state.team : [];
      container.innerHTML = `
        <div class="section-header">
          <div class="section-title">Команда</div>
          <div class="card-actions">
            <span class="section-count">${members.length}</span>
            <button type="button" class="btn-primary" id="addTeamMemberBtn">+ Добавить</button>
          </div>

        ${members.length === 0 ? `
          <div class="empty-state">
            <div class="empty-state-title">Список команды пуст</div>
            <div class="empty-state-sub">Нажмите «+ Добавить», чтобы добавить участника команды.</div>

          <div class="card-list">

              <div class="card">
                <div class="card-top">

                    <div class="card-title">${escapeHtml(t.name || "")}</div>

              </div>
            `).join("")}
          </div>
        `}
      `;

      const openTeamMemberSheet = (member = null) => {
        const isEdit = Boolean(member);
        openSheet(`
          <div class="sheet-header">
            <div class="sheet-title">${isEdit ? "Редактировать участника" : "Новый участник команды"}</div>
            <button class="icon-btn" id="closeSheetBtn" aria-label="Закрыть">✕</button>
          </div>
          <form id="teamMemberForm">
            <div class="form-group">
              <label class="form-label">Имя / ник</label>
              <input class="form-control" name="name" type="text" value="${escapeHtml(member?.name || "")}" required />
            </div>
            <div class="form-group">
              <label class="form-label">Роль / должность</label>
              <input class="form-control" name="role" type="text" value="${escapeHtml(member?.role || "")}" required />
            </div>
            <div class="form-group">
              <label class="form-label">Заметка / рабочие номера</label>

    function formatTodayDotDate() {
      const now = new Date();
      const dd = String(now.getDate()).padStart(2, "0");
      const mm = String(now.getMonth() + 1).padStart(2, "0");
      const yyyy = String(now.getFullYear());
      return `${dd}.${mm}.${yyyy}`;
    }

    function parseNumericPrice(val) {
      const cleaned = String(val ?? "").replace(/\s+/g, "").replace(",", ".");
      const match = cleaned.match(/-?\d+(?:\.\d+)?/);
      return match ? Number(match[0]) || 0 : 0;
    }

    function formatAccountingEntryText(entry) {
      return [
        entry.date || "",
        `Модель: ${entry.model || ""}`,
        `Продолжительность: ${entry.duration || ""}`,
        `Прайс: ${entry.price || ""}`,
        `Оператор: ${entry.operator || ""}`,
        `Время: ${entry.time || ""}`,
        `Номер клиента: ${entry.clientPhone || ""}`,
        `Отзыв: ${entry.review || ""}`,
        `Адрес: ${entry.address || ""}`
      ].join("\n").trim();
    }

    function buildShiftReportText(report) {
      const orders = Array.isArray(report.orders) ? report.orders : [];
      const orderBlocks = orders.map((ord) => [
        `Модель:${ord.model || ""}`,
        `Продолжительность:${ord.duration || ""}`,
        `Прайс: ${ord.price || ""}`
      ].join("\n")).join("\n\n");

      const parts = [
        report.date || "",
        `Кол-во соо: ${report.messagesCount || ""}`,
        `Заказы-${report.ordersCount || orders.length || 0}`
      ];
      if (orderBlocks) parts.push(orderBlocks);
      parts.push(`Оператор:${report.operator || ""}`);
      parts.push(`Тотал ${report.total || ""}`.trim());
      return parts.join("\n\n").trim();
    }

    function buildDailyClosingText(closing) {
      const slashLeft = String(closing.slashLeft ?? "").trim();
      const slashRight = String(closing.slashRight ?? "").trim();
      return [
        closing.date || formatTodayDotDate(),
        `ТОТАЛ ДНЯ: ${closing.totalDay ?? ""}`.trim(),
        `${slashLeft}/${slashRight}`
      ].join("\n");
    }

    function buildWeeklyReportText(weekly) {
      return [
        "ВЫПЛАЧЕНО",
        "🥩🥩🥩🥩🥩🥩🥩🥩🥩",
        `ТОТАЛ НЕДЕЛИ ГРУЗИЯ/АРМЕНИЯ/ДУБАЙ : ${weekly.totalWeek ?? ""}`.trim()
      ].join("\n\n");
    }

    function renderAccountingSubTab(container) {
      const entries = Array.isArray(state.acc) ? state.acc : [];
      const closings = Array.isArray(state.closings) ? state.closings : [];
      const totalSum = entries.reduce((s, item) => s + parseNumericPrice(item.price), 0);
      const selectedSum = entries
        .filter((item) => selectedAccIds.has(item.id))
        .reduce((s, item) => s + parseNumericPrice(item.price), 0);
      const allSelected = entries.length > 0 && entries.every((item) => selectedAccIds.has(item.id));

      const chronologicalClosings = [...closings].reverse();
      const feedItems = [];
      let entryCursor = 0;

      for (let i = chronologicalClosings.length - 1; i >= 0; i -= 1) {
        const cl = chronologicalClosings[i];
        const snapshotCount = Math.max(0, Math.min(entries.length, Number(cl.count ?? entries.length)));
        const newerEntriesCount = Math.max(0, entries.length - snapshotCount);
        while (entryCursor < newerEntriesCount && entryCursor < entries.length) {
          feedItems.push({ kind: "entry", item: entries[entryCursor] });
          entryCursor += 1;
        }
        feedItems.push({ kind: "closing", item: cl });
      }

      while (entryCursor < entries.length) {
        feedItems.push({ kind: "entry", item: entries[entryCursor] });
        entryCursor += 1;
      }

      container.innerHTML = `
        <div class="stats-grid">
          <div class="stat-box">
            <div class="stat-label">Записей в кассе</div>
            <div class="stat-val">${entries.length}</div>
          </div>
          <div class="stat-box">
            <div class="stat-label">Выбрано / Всего</div>
            <div class="stat-val">${selectedAccIds.size > 0 ? selectedSum : totalSum}</div>
          </div>
        </div>

        <div class="card-actions" style="margin-bottom:12px; flex-wrap:wrap;">
          <button type="button" class="btn-primary" id="openAddAccBtn" style="flex:1;">+ Запись</button>
          <button type="button" class="btn-secondary" id="selectAllAccBtn">${allSelected ? "Снять все" : "Выделить все"}</button>
          <button type="button" class="btn-primary" id="calcCloseCashBtn">Рассчитать</button>
        </div>

        ${feedItems.length === 0 ? `
          <div class="empty-state" style="margin-bottom:14px;">
            <div class="empty-state-title">Записей бухгалтерии пока нет</div>
            <div class="empty-state-sub">Нажмите «+ Запись», чтобы добавить первую встречу.</div>
          </div>
        ` : `
          <div class="card-list" style="margin-bottom:16px;">
            ${feedItems.map((node) => {
              if (node.kind === "closing") {
                const cl = node.item;
                return `
                  <div class="card">
                    <div class="card-top">
                      <div class="card-sub" style="margin:0; color:var(--text); font-weight:600;">${escapeHtml(buildDailyClosingText(cl))}</div>
                      <div class="card-actions">
                        <button type="button" class="mini-btn copy-closing-btn" data-id="${escapeHtml(cl.id)}">Копировать</button>
                        <button type="button" class="mini-btn danger del-closing-btn" data-id="${escapeHtml(cl.id)}">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }

              const item = node.item;
              const isChecked = selectedAccIds.has(item.id);
              return `
                <div class="card">
                  <div class="card-top">
                    <label style="display:flex; align-items:flex-start; gap:10px; flex:1; cursor:pointer;">
                      <input type="checkbox" class="acc-select-cb" data-id="${escapeHtml(item.id)}" ${isChecked ? "checked" : ""} style="margin-top:4px; width:17px; height:17px;" />
                      <div>
                        <div class="card-title">${escapeHtml(item.model || "Без модели")}${item.date ? ` · ${escapeHtml(item.date)}` : ""}</div>
                        <div class="card-sub">${escapeHtml(formatAccountingEntryText(item))}</div>
                      </div>
                    </label>
                    <div class="card-actions">
                      <button type="button" class="mini-btn copy-acc-btn" data-id="${escapeHtml(item.id)}">Копировать</button>
                      <button type="button" class="mini-btn danger del-acc-btn" data-id="${escapeHtml(item.id)}">✕</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `}
      `;

      document.getElementById("openAddAccBtn").addEventListener("click", () => {
        openAddAccountingSheet(() => renderAccountingSubTab(container));
      });

      document.getElementById("selectAllAccBtn").addEventListener("click", () => {
        if (allSelected) {
          selectedAccIds.clear();
        } else {
          selectedAccIds = new Set(entries.map((item) => item.id));
        }
        renderAccountingSubTab(container);
      });

      document.getElementById("calcCloseCashBtn").addEventListener("click", () => {
        openCloseCashSheet(() => renderAccountingSubTab(container));
      });

      container.querySelectorAll(".acc-select-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) selectedAccIds.add(cb.dataset.id);
          else selectedAccIds.delete(cb.dataset.id);
          renderAccountingSubTab(container);
        });
      });

      container.querySelectorAll(".copy-acc-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const item = entries.find((x) => x.id === btn.dataset.id);
          if (item) copyText(formatAccountingEntryText(item));
        });
      });

      container.querySelectorAll(".del-acc-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedAccIds.delete(btn.dataset.id);
          state.acc = entries.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderAccountingSubTab(container);
          showToast("Запись удалена");
        });
      });

      container.querySelectorAll(".copy-closing-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const cl = closings.find((x) => x.id === btn.dataset.id);
          if (cl) copyText(buildDailyClosingText(cl));
        });
      });

      container.querySelectorAll(".del-closing-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.closings = closings.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderAccountingSubTab(container);
          showToast("Закрытие удалено");
        });
      });
    }

    function renderShiftsSubTab(container) {
      const shifts = Array.isArray(state.shifts) ? state.shifts : [];
      const weeklyReports = Array.isArray(state.weeklyReports) ? state.weeklyReports : [];
      const allSelected = shifts.length > 0 && shifts.every((s) => selectedShiftIds.has(s.id));

      const chronologicalWeekly = [...weeklyReports].reverse();
      const feedItems = [];
      let shiftCursor = 0;

      for (let i = chronologicalWeekly.length - 1; i >= 0; i -= 1) {
        const wk = chronologicalWeekly[i];
        const snapshotCount = Math.max(0, Math.min(shifts.length, Number(wk.count ?? shifts.length)));
        const newerShiftsCount = Math.max(0, shifts.length - snapshotCount);
        while (shiftCursor < newerShiftsCount && shiftCursor < shifts.length) {
          feedItems.push({ kind: "shift", item: shifts[shiftCursor] });
          shiftCursor += 1;
        }
        feedItems.push({ kind: "weekly", item: wk });
      }

      while (shiftCursor < shifts.length) {
        feedItems.push({ kind: "shift", item: shifts[shiftCursor] });
        shiftCursor += 1;
      }

      container.innerHTML = `
        <div class="card-actions" style="margin-bottom:12px; flex-wrap:wrap;">
          <button type="button" class="btn-primary" id="openAddShiftBtn" style="flex:1;">+ Отчёт смены</button>
          <button type="button" class="btn-secondary" id="selectAllShiftsBtn">${allSelected ? "Снять все" : "Выделить все"}</button>
          <button type="button" class="btn-primary" id="calcWeeklyBtn">Рассчитать неделю</button>
        </div>

        ${feedItems.length === 0 ? `
          <div class="empty-state" style="margin-bottom:14px;">
            <div class="empty-state-title">Отчётов смен пока нет</div>
            <div class="empty-state-sub">Нажмите «+ Отчёт смены», чтобы сформировать отчёт по смене.</div>
          </div>
        ` : `
          <div class="card-list" style="margin-bottom:16px;">
            ${feedItems.map((node) => {
              if (node.kind === "weekly") {
                const wk = node.item;
                return `
                  <div class="card">
                    <div class="card-top">
                      <div class="card-sub" style="margin:0; color:var(--text); font-weight:600;">${escapeHtml(buildWeeklyReportText(wk))}</div>
                      <div class="card-actions">
                        <button type="button" class="mini-btn copy-weekly-btn" data-id="${escapeHtml(wk.id)}">Копировать</button>
                        <button type="button" class="mini-btn danger del-weekly-btn" data-id="${escapeHtml(wk.id)}">✕</button>
                      </div>
                    </div>
                  </div>
                `;
              }

              const rep = node.item;
              const isChecked = selectedShiftIds.has(rep.id);
              return `
                <div class="card">
                  <div class="card-top">
                    <label style="display:flex; align-items:flex-start; gap:10px; flex:1; cursor:pointer;">
                      <input type="checkbox" class="shift-select-cb" data-id="${escapeHtml(rep.id)}" ${isChecked ? "checked" : ""} style="margin-top:4px; width:17px; height:17px;" />
                      <div>
                        <div class="card-title">${escapeHtml(rep.date || "Отчёт")}${rep.operator ? ` · ${escapeHtml(rep.operator)}` : ""}</div>
                        <div class="card-sub">${escapeHtml(buildShiftReportText(rep))}</div>
                      </div>
                    </label>
                    <div class="card-actions">
                      <button type="button" class="mini-btn copy-shift-btn" data-id="${escapeHtml(rep.id)}">Копировать</button>
                      <button type="button" class="mini-btn danger del-shift-btn" data-id="${escapeHtml(rep.id)}">✕</button>
                    </div>
                  </div>
                </div>
              `;
            }).join("")}
          </div>
        `}
      `;

      document.getElementById("openAddShiftBtn").addEventListener("click", () => {
        openAddShiftReportSheet(() => renderShiftsSubTab(container));
      });

      document.getElementById("selectAllShiftsBtn").addEventListener("click", () => {
        if (allSelected) {
          selectedShiftIds.clear();
        } else {
          selectedShiftIds = new Set(shifts.map((s) => s.id));
        }
        renderShiftsSubTab(container);
      });

      document.getElementById("calcWeeklyBtn").addEventListener("click", () => {
        openWeeklyReportSheet(() => renderShiftsSubTab(container));
      });

      container.querySelectorAll(".shift-select-cb").forEach((cb) => {
        cb.addEventListener("change", () => {
          if (cb.checked) selectedShiftIds.add(cb.dataset.id);
          else selectedShiftIds.delete(cb.dataset.id);
          renderShiftsSubTab(container);
        });
      });

      container.querySelectorAll(".copy-shift-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const rep = shifts.find((x) => x.id === btn.dataset.id);
          if (rep) copyText(buildShiftReportText(rep));
        });
      });

      container.querySelectorAll(".del-shift-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          selectedShiftIds.delete(btn.dataset.id);
          state.shifts = shifts.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderShiftsSubTab(container);
          showToast("Отчёт смены удалён");
        });
      });

      container.querySelectorAll(".copy-weekly-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const wk = weeklyReports.find((x) => x.id === btn.dataset.id);
          if (wk) copyText(buildWeeklyReportText(wk));
        });
      });

      container.querySelectorAll(".del-weekly-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.weeklyReports = weeklyReports.filter((x) => x.id !== btn.dataset.id);
          saveState();
          renderShiftsSubTab(container);
          showToast("Недельный отчёт удалён");
        });
      });
    }

    function renderOpsTab(container) {
      container.innerHTML = `
        <div class="section-header">
          <div class="section-title">Касса и отчёты</div>
        </div>
        <div class="segmented">
          <button type="button" class="seg-btn ${opsSubTab === "acc" ? "active" : ""}" data-opssub="acc">Бухгалтерия</button>
          <button type="button" class="seg-btn ${opsSubTab === "shifts" ? "active" : ""}" data-opssub="shifts">Отчёты смен</button>
        </div>
        <div id="opsSubContent"></div>
      `;

      container.querySelectorAll("[data-opssub]").forEach((btn) => {
        btn.addEventListener("click", () => {
          opsSubTab = btn.dataset.opssub || "acc";
          renderOpsTab(container);
        });
      });

      const subContent = document.getElementById("opsSubContent");
      if (!subContent) return;

      if (opsSubTab === "shifts") {
        renderShiftsSubTab(subContent);
      } else {
        renderAccountingSubTab(subContent);
      }
    }

    function renderMain() {
      const mainView = document.getElementById("mainView");
      if (!mainView) return;

      document.querySelectorAll("#bottomNav .nav-item").forEach((navBtn) => {
        navBtn.classList.toggle("active", navBtn.dataset.tab === activeTab);
      });

      if (activeTab === "bl") {
        renderBlacklistTab(mainView);
      } else if (activeTab === "models") {
        renderModelsTab(mainView);
      } else if (activeTab === "team") {
        renderTeamTab(mainView);
      } else if (activeTab === "info") {
        renderInfoTab(mainView);
      } else if (activeTab === "ops") {
        renderOpsTab(mainView);
      }
    }

    function initApp() {
      document.querySelectorAll("#bottomNav .nav-item").forEach((navBtn) => {
        navBtn.addEventListener("click", () => {
          activeTab = navBtn.dataset.tab || "bl";
          renderMain();
        });
      });

      const sideEdgeBtn = document.getElementById("sidePaymentEdgeBtn");
      if (sideEdgeBtn) sideEdgeBtn.addEventListener("click", () => openSidePaymentDrawer(false));

      const sideOtcBtn = document.getElementById("sideOtcEdgeBtn");
      if (sideOtcBtn) sideOtcBtn.addEventListener("click", () => openSideOtcDrawer(false));

      const sideDrawer = document.getElementById("sidePaymentDrawer");
      if (sideDrawer) {
        sideDrawer.addEventListener("click", (e) => {
          if (e.target === sideDrawer) closeSidePaymentDrawer();
        });
      }

      const sideOtcDrawer = document.getElementById("sideOtcDrawer");
      if (sideOtcDrawer) {
        sideOtcDrawer.addEventListener("click", (e) => {
          if (e.target === sideOtcDrawer) closeSideOtcDrawer();
        });
      }

      const backdrop = document.getElementById("sheetBackdrop");
      if (backdrop) {
        backdrop.addEventListener("click", (e) => {
          if (e.target === backdrop) closeSheet();
        });
      }

      window.addEventListener("pagehide", () => {
        try {
          localStorage.setItem(STORE_KEY, JSON.stringify(buildSyncableState(state, { includePhotos: true })));
        } catch (e) {}
      });

      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "hidden") {
          try {
            localStorage.setItem(STORE_KEY, JSON.stringify(buildSyncableState(state, { includePhotos: true })));
          } catch (e) {}
        }
      });

      renderMain();
      void hydrateStoredPhotos(state.models);
      void hydrateStoredVideos(state.models);
      void initSharedGroupSync();
    }

    if (document.readyState === "loading") {
      document.addEventListener("DOMContentLoaded", initApp);
    } else {
      initApp();
    }
  </script>
</body>
</html>
